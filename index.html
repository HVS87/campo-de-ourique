<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campo de Ourique</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<script src="vendor/leaflet/leaflet.js"></script>
<script src="dados/geo.js"></script>
<script src="dados/ruas.js"></script>
<script src="dados/edificado.js"></script>
<script src="dados/conteudos.js"></script>
<style>
  :root {
    --bg: #0f1216; --panel: rgba(18, 22, 28, .94); --panel-border: rgba(255,255,255,.12);
    --ink: #eef1f5; --ink-dim: #a6afbb; --accent: #f3c35b; --accent-ink: #1a1405;
    --ponto: #f3c35b; /* as cores por tipo estão no mapa COR do script */
    --radius: 14px; --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --painel-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #map { position: absolute; inset: 0; background: #0b0d10; }
  button { font: inherit; }
  .vidro { background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .redondo { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); cursor: pointer; font-size: 18px; padding: 0; }
  .redondo:hover { background: rgba(40,46,56,.96); }
  .redondo.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* ---- barra superior: índice, título, pesquisa ---- */
  #btn-painel { position: absolute; top: 14px; left: 14px; z-index: 1001; }
  #marca { position: absolute; top: 14px; left: 66px; z-index: 1000; height: 42px; display: flex; align-items: center; padding: 0 16px 0 14px; border-radius: 21px; pointer-events: none; }
  #marca b { font-size: 15px; letter-spacing: .3px; }
  #marca small { color: var(--ink-dim); font-size: 12px; margin-left: 8px; }
  #pesquisa-box { position: absolute; top: 14px; right: 66px; z-index: 1060; width: 300px; transition: width .2s; }
  #pesquisa-box .campo { position: relative; height: 42px; border-radius: 21px; display: flex; align-items: center; }
  #pesquisa-box .lupa { position: absolute; left: 13px; top: 11px; width: 18px; height: 18px; color: var(--ink-dim); pointer-events: none; }
  #pesquisa, #ghost { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0 38px 0 40px; border: 0; border-radius: 21px; font: inherit; font-size: 14px; background: transparent; }
  #pesquisa { color: var(--ink); outline: none; z-index: 2; }
  #pesquisa::placeholder { color: var(--ink-dim); }
  #ghost { color: var(--ink-dim); white-space: pre; overflow: hidden; display: flex; align-items: center; z-index: 1; pointer-events: none; opacity: .75; }
  #ghost span { visibility: hidden; }
  #pesquisa-limpar { position: absolute; right: 8px; top: 7px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-dim); cursor: pointer; display: none; z-index: 3; }
  #pesquisa-box.com-texto #pesquisa-limpar { display: block; }
  #pesquisa-limpar:hover { background: rgba(255,255,255,.1); color: var(--ink); }
  #sugestoes { margin-top: 6px; border-radius: var(--radius); display: none; max-height: min(60vh, 420px); overflow-y: auto; }
  #sugestoes.aberto { display: block; }
  #sugestoes button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 13.5px; }
  #sugestoes button:hover, #sugestoes button.ativo { background: rgba(255,255,255,.08); }
  #sugestoes button b { font-weight: 600; color: var(--accent); }
  #sugestoes .etq { margin-left: auto; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-dim); flex: none; }
  #sugestoes .nada { padding: 10px 14px; color: var(--ink-dim); font-size: 13px; }
  .pinta { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c); }
  .pinta.rua, .pinta.zona { border-radius: 2px; }
  .pinta.rua-osm { background: transparent; border-top: 2px solid #ddd; height: 0; width: 10px; border-radius: 0; }

  /* ---- painel esquerdo colapsável: índice ---- */
  #painel { position: absolute; top: 0; left: 0; bottom: 0; z-index: 1000; width: var(--painel-w); display: flex; flex-direction: column; border-radius: 0; border-width: 0 1px 0 0; transform: translateX(-100%); transition: transform .25s; }
  #painel.aberto { transform: none; }
  #painel header { padding: 70px 18px 12px; border-bottom: 1px solid var(--panel-border); }
  #painel h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  #painel h1 small { display: block; font-weight: 400; color: var(--ink-dim); font-size: 12.5px; margin-top: 3px; }
  .acoes { display: flex; gap: 6px; padding: 12px 12px 4px; flex-wrap: wrap; }
  .btn { font-size: 12.5px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--panel-border); background: rgba(255,255,255,.06); color: var(--ink); cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #indice { padding: 8px 10px 16px; display: grid; gap: 2px; overflow: auto; align-content: start; }
  #indice h3 { margin: 10px 8px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); font-weight: 600; }
  #indice button { text-align: left; font-size: 13px; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  #indice button:hover { background: rgba(255,255,255,.06); }
  #indice button.sel { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
  #indice button.filho { padding-left: 28px; font-size: 12.5px; color: var(--ink-dim); }
  #indice .vazio { color: var(--ink-dim); padding: 8px; font-size: 12px; line-height: 1.4; }
  #indice .ico { width: 20px; text-align: center; flex: none; }
  .rodape { margin-top: auto; padding: 10px 14px 12px; border-top: 1px solid var(--panel-border); color: var(--ink-dim); font-size: 12px; line-height: 1.45; }
  .rodape a { color: #ccc; }

  /* ---- canto inferior esquerdo: zoom e camada de ruas ---- */
  .leaflet-bottom.leaflet-left { margin: 0 0 calc(14px + env(safe-area-inset-bottom, 0px)) 14px; display: flex; flex-direction: column-reverse; gap: 8px; }
  .leaflet-bottom.leaflet-left .leaflet-control { margin: 0; }
  .leaflet-bar { border: 1px solid var(--panel-border) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45) !important; }
  .leaflet-bar a { width: 36px !important; height: 36px !important; line-height: 36px !important; background: var(--panel) !important; color: var(--ink) !important; border-color: var(--panel-border) !important; backdrop-filter: blur(10px); }
  .leaflet-bar a:hover { background: rgba(40,46,56,.96) !important; }
  /* painel de camadas, colapsável (fechado ao arrancar) */
  #camadas { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
  #btn-camadas { height: 38px; padding: 0 14px 0 12px; border-radius: 19px; display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; font-size: 12.5px; }
  #btn-camadas:hover { background: rgba(40,46,56,.96); }
  #btn-camadas.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #btn-camadas svg { width: 16px; height: 16px; }
  #btn-camadas .conta { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 12px; font-weight: 700; display: none; place-items: center; background: var(--accent); color: var(--accent-ink); }
  #btn-camadas.algumas .conta { display: grid; } #btn-camadas.on .conta { background: #1a1405; color: var(--accent); }
  #lista-camadas { display: none; flex-direction: column; border-radius: var(--radius); padding: 6px; min-width: 230px; }
  #lista-camadas.aberto { display: flex; }
  #lista-camadas h4 { margin: 4px 8px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); font-weight: 600; }
  .camada { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 13px; white-space: nowrap; text-align: left; }
  .camada:hover { background: rgba(255,255,255,.07); }
  .camada.on { color: #fff; }
  .camada .inter { width: 28px; height: 16px; border-radius: 8px; background: rgba(255,255,255,.18); position: relative; flex: none; transition: background .15s; }
  .camada .inter::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
  .camada.on .inter { background: var(--accent); } .camada.on .inter::after { left: 14px; background: #1a1405; }
  .camada small { color: var(--ink-dim); font-size: 11px; margin-left: auto; padding-left: 10px; }
  /* números de polícia e lotes */
  .leaflet-numeros-pane { pointer-events: none; }
  .num-canvas { position: absolute; left: 0; top: 0; }
  .leaflet-control-attribution { background: rgba(0,0,0,.75) !important; color: #ccc !important; font-size: 11px; }
  .leaflet-control-attribution a { color: #e8e8e8 !important; }

  /* ---- limite ---- */
  .leaflet-interactive:focus:not(:focus-visible) { outline: none; }
  .leaflet-interactive:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .limite { filter: drop-shadow(0 0 6px rgba(255,255,255,.55)); }
  .limite-halo { filter: blur(6px); }

  /* ---- marcadores: círculos, pulsantes ao passar o cursor ---- */
  .mk { position: relative; }
  .mk-circ { position: absolute; inset: 0; border-radius: 50%; background: var(--c, var(--ponto)); border: 2px solid rgba(20,20,20,.9); box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 2px 8px rgba(0,0,0,.6); transition: transform .15s; }
  .mk-circ::before, .mk-circ::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--c, var(--ponto)); opacity: 0; }
  .mk:hover .mk-circ { transform: scale(1.15); }
  .mk:hover .mk-circ::before, .mk.sel .mk-circ::before { animation: pulso 1.6s ease-out infinite; }
  .mk:hover .mk-circ::after, .mk.sel .mk-circ::after { animation: pulso 1.6s ease-out .8s infinite; }
  @keyframes pulso { 0% { transform: scale(.7); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
  .mk.sel .mk-circ { box-shadow: 0 0 0 3px #fff, 0 2px 10px rgba(0,0,0,.7); }
  .rotulo { background: rgba(10,12,16,.88); color: #fff; padding: 3px 9px; border-radius: 7px; font-size: 12px; white-space: nowrap; border: 1px solid rgba(255,255,255,.15); pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .rotulo::before { display: none; }

  /* ---- camada de ruas (opcional) ---- */
  .pane-ruas .rua-linha { stroke: rgba(255,255,255,.55); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s, stroke-width .15s; }
  .pane-ruas .rua-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  .pane-ruas .rua-linha.hover, .pane-ruas .rua-linha.destaque { stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 5px rgba(243,195,91,.7)); }
  .pane-ruas .rua-nome { font: 600 12px/1 var(--font); fill: #fff; letter-spacing: .4px; paint-order: stroke fill; stroke: rgba(0,0,0,.85); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .pane-ruas.z17 .rua-nome { opacity: .95; }
  .pane-ruas .rua-nome.curto { opacity: 0 !important; }
  .pane-ruas .rua-nome.hover, .pane-ruas .rua-nome.destaque { opacity: 1 !important; fill: var(--accent); font-size: 13px; }
  .pane-ruas.ruas-off .rua-linha:not(.destaque), .pane-ruas.ruas-off .rua-nome:not(.destaque) { opacity: 0 !important; }
  .pane-ruas.ruas-off .rua-hit { pointer-events: none; }

  /* ---- cartão central ---- */
  #modal { position: absolute; inset: 0; z-index: 1100; background: rgba(0,0,0,.42); display: none; place-items: center; padding: 20px 20px 90px; }
  #modal.aberto { display: grid; }
  #modal.lado, #modal.baixo { background: transparent; pointer-events: none; }
  #modal.lado { justify-items: end; padding: 70px 14px 14px; }
  #modal.lado .cartao { pointer-events: auto; width: min(400px, 100%); animation-name: surgir-lado; }
  #modal.baixo { justify-items: center; align-items: end; padding: 12px 12px 80px; }
  #modal.baixo .cartao { pointer-events: auto; width: min(600px, 100%); max-height: 38vh; }
  @keyframes surgir-lado { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  #modal .cartao { position: relative; width: min(600px, 100%); max-height: 100%; overflow: auto; border-radius: 18px; padding: 22px 26px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.65); animation: surgir .22s ease-out; }
  @keyframes surgir { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .fechar { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.06); border: 0; color: var(--ink-dim); font-size: 16px; cursor: pointer; }
  .fechar:hover { background: rgba(255,255,255,.14); color: var(--ink); }
  .info h2 { margin: 0 36px 4px 0; font-size: 23px; line-height: 1.2; display: flex; gap: 10px; align-items: center; }
  .info h2 .pinta { width: 12px; height: 12px; }
  .info .tipo { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); margin: 0 0 14px 22px; }
  .info .tipo a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .info .texto { font-size: 15px; line-height: 1.55; color: #d8dde5; }
  .info .texto p { margin: 0 0 10px; }
  .info .texto a { color: var(--accent); }
  .fotos { display: grid; gap: 10px; margin: 0 0 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .fotos figure { margin: 0; }
  .fotos img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; cursor: zoom-in; background: #1a1f27; }
  .fotos figcaption { font-size: 12px; color: var(--ink-dim); margin-top: 4px; line-height: 1.4; }
  .filhos { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--panel-border); }
  .filhos h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); font-weight: 600; }
  .filhos button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; font-size: 14px; }
  .filhos button:hover { background: rgba(255,255,255,.07); }
  /* ---- categorias: chips no índice e nos cartões; visita editável ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 8px 6px; }
  .chip-wrap { display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; border: 1px solid var(--panel-border); background: rgba(255,255,255,.04); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 12.5px; border-radius: 999px; white-space: nowrap; }
  .chip::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--accent)); flex: none; }
  .chip small { color: var(--ink-dim); font-size: 12px; }
  .chip-wrap .chip { border-radius: 0; }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip.on { background: var(--c, var(--accent)); color: #1a1405; font-weight: 600; } .chip.on small { color: rgba(26,20,5,.8); }
  .chip.on.clara { color: #fff; } .chip.on.clara small { color: rgba(255,255,255,.85); } /* cor escura escolhida pelo utilizador: texto claro */
  .chip-acao { border: 0; border-left: 1px solid var(--panel-border); background: transparent; color: var(--ink-dim); cursor: pointer; padding: 0 10px; min-width: 34px; font-size: 12px; }
  .chip-acao:hover { background: rgba(255,255,255,.1); color: var(--ink); }
  .chip.nova, .chip.limpar { border: 1px dashed var(--panel-border); color: var(--ink-dim); } .chip.nova::before, .chip.limpar::before { display: none; }
  .chip.mini { font-size: 11.5px; padding: 3px 9px 3px 7px; border: 1px solid var(--panel-border); margin: 0 6px 10px 0; }
  .cats { display: flex; flex-wrap: wrap; }
  .oculto { display: none !important; }
  .pinta.categoria { border-radius: 3px; }
  .visita-ed { list-style: none; margin: 0; padding: 0 8px 6px; counter-reset: passo; }
  .visita-ed li { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; font-size: 12.5px; counter-increment: passo; }
  .visita-ed li::before { content: counter(passo); width: 18px; color: var(--ink-dim); font-size: 11px; flex: none; }
  .visita-ed li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .visita-ed li button { width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--ink-dim); cursor: pointer; font-size: 12px; }
  .visita-ed li button:hover { background: rgba(255,255,255,.1); color: var(--ink); }
  .visita-ed li.nota { color: var(--ink-dim); } .visita-ed li.nota::before { display: none; }
  .linha-ed { display: flex; gap: 6px; padding: 0 8px 8px; align-items: center; }
  .seletor { font: inherit; font-size: 12.5px; background: rgba(255,255,255,.06); border: 1px solid var(--panel-border); color: var(--ink); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
  .seletor option { background: #1a1f27; color: var(--ink); }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .check { display: inline-flex !important; align-items: center; gap: 6px; font-size: 13px !important; color: var(--ink) !important; margin: 4px 0 !important; cursor: pointer; }
  .check input { width: auto !important; margin: 0 !important; accent-color: var(--accent); }
  .check.destaque { margin-top: 8px !important; }
  .membro { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; font-size: 13.5px; }
  .membro span:nth-child(2) { flex: 1; }
  .membro .fechar { position: static; width: 28px; height: 28px; }
  .form-edicao .cor input { width: 44px; height: 32px; padding: 2px; display: inline-block; cursor: pointer; }
  .form-edicao .sel { margin-top: 8px; width: 100%; }
  #guiao .seletor { padding: 5px 8px; border-radius: 999px; font-size: 12px; max-width: 160px; }
  .nota { color: var(--ink-dim); font-size: 12px; line-height: 1.4; }

  /* ---- lightbox ---- */
  #lightbox { position: absolute; inset: 0; z-index: 1300; background: rgba(0,0,0,.9); display: none; place-items: center; cursor: zoom-out; }
  #lightbox.aberto { display: grid; }
  #lightbox img { max-width: 94vw; max-height: 86vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
  #lightbox figcaption { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; color: #ddd; font-size: 14px; padding: 0 20px; }

  /* ---- guião ---- */
  #guiao { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1200; display: none; gap: 8px; align-items: center; border-radius: 999px; padding: 6px 8px; max-width: calc(100vw - 16px); }
  #guiao.aberto { display: flex; }
  #guiao .seta { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 18px; cursor: pointer; }
  #guiao .seta:hover { filter: brightness(1.08); }
  #guiao .texto { min-width: 240px; text-align: center; font-size: 13.5px; padding: 0 6px; }
  #guiao .texto small { display: block; color: var(--ink-dim); font-size: 12px; }
  #guiao .sair { width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-dim); cursor: pointer; font-size: 14px; }
  #guiao .sair:hover { background: rgba(255,255,255,.1); color: var(--ink); }

  /* ---- avisos ---- */
  #aviso { position: absolute; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1250; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 12.5px; display: none; max-width: 90vw; text-align: center; }
  #aviso.aberto { display: block; }

  /* ---- modo de edição ---- */
  #btn-editar { position: absolute; top: 14px; right: 14px; z-index: 1002; }
  #btn-editar svg { width: 18px; height: 18px; }
  #barra-edicao { display: none; position: absolute; left: 50%; top: 66px; transform: translateX(-50%); z-index: 1050; border-radius: var(--radius); padding: 8px 10px; width: min(760px, 94vw); font-size: 12.5px; }
  #barra-edicao.aberto { display: block; }
  #barra-edicao .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #barra-edicao .row + .row { margin-top: 6px; }
  #barra-edicao .sep { width: 1px; height: 22px; background: var(--panel-border); margin: 0 4px; }
  #barra-edicao .estado { margin-left: auto; color: var(--ink-dim); font-size: 12px; white-space: nowrap; }
  #barra-edicao.sujo .estado { color: #ffb86b; font-weight: 600; }

<body>
<div id="map"></div>

<button id="btn-painel" class="vidro redondo" aria-label="Abrir índice" aria-expanded="false">☰</button>
<div id="marca" class="vidro"><b id="marca-titulo">Campo de Ourique</b><small id="marca-sub"></small></div>

<div id="pesquisa-box">
  <div class="campo vidro">
    <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <div id="ghost" aria-hidden="true"></div>
    <input id="pesquisa" type="text" placeholder="Pesquisar lugares e ruas…" autocomplete="off" spellcheck="false" aria-label="Pesquisar" aria-autocomplete="both" aria-controls="sugestoes">

  </div>

</div>

<aside id="painel" class="vidro">

  <div class="acoes">
    <button class="btn" id="btn-guiao">▶ Visita guiada</button>
    <button class="btn" id="btn-repor">Vista geral</button>
  </div>
  <nav id="indice" aria-label="Índice"></nav>
  <div class="rodape">Ortoimagens © DGT 2023 (CC BY 4.0) · Limites e ruas © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
</aside>

<div id="modal"><div class="cartao vidro"><button class="fechar" id="btn-fechar" aria-label="Fechar">✕</button><div id="modal-conteudo"></div></div></div>

  </div>

    <button class="btn" id="btn-novo-preset" title="Começar um preset vazio (elimina o atual)">Novo</button>

    <button class="btn" id="btn-exportar" title="Transferir o preset atual em JSON">Exportar</button>

</aside>

<script>
(function () {
'use strict';
const D = window.MAPA_DADOS;
const C = window.CONTEUDOS || {};
const RUAS = window.RUAS_OSM || [];
const LIMITE = D.limite;
const COR = { ponto: '#f3c35b', grupo: '#7ad3ff', rua: '#ff8a5b', zona: '#9be38a' };
const TIPO = { ponto: 'Ponto', grupo: 'Conjunto de pontos', rua: 'Rua', zona: 'Zona' };
const EDITOR = new URLSearchParams(location.search).has('editor');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normalizar = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // sem acentos nem maiúsculas
const corEscura = hex => { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); if (!m) return false; const [r, g, b] = m.slice(1).map(h => parseInt(h, 16) / 255); return .2126 * r + .7152 * g + .0722 * b < .45; }; // para pôr texto claro em chips de cor escura
const estreito = () => window.innerWidth <= 640;

aplicarTitulo(); // definida mais abaixo (as declarações de função sobem)

// ---------- elementos ----------
function centro(pts) { let a = 0, b = 0; for (const p of pts) { a += p[0]; b += p[1]; } return [a / pts.length, b / pts.length]; }
const ELEMENTOS = [];
const POR_ID = {};
function preparar(el, pai) {
  if (!el || !el.id || !TIPO[el.tipo]) { console.warn('Elemento ignorado (sem id ou tipo válido):', el); return null; }
  if (POR_ID[el.id]) console.warn('Id repetido:', el.id);
  if (pai && el.tipo !== 'ponto') { console.warn('Só pontos podem ser filhos de uma zona:', el.id); return null; }
  el.pai = pai || null;
  // geometrias vindas de geo.js / ruas.js são copiadas, para a edição não alterar os dados partilhados
  if (el.tipo === 'rua' && !el.linhas) {
    let linhas = D.ruas[el.rua || el.nome];
    if (!linhas) { const r = RUAS.find(x => x.nome === (el.rua || el.nome)); if (r) linhas = r.trocos; }
    if (linhas) el.linhas = linhas.map(l => l.map(p => p.slice()));
  }
  if (el.tipo === 'zona' && !el.poligono && D.areas[el.area || el.nome]) el.poligono = D.areas[el.area || el.nome].map(p => p.slice());
  el.fotos = Array.isArray(el.fotos) ? el.fotos : []; el.texto = el.texto || '';
  if (el.tipo === 'ponto' && !el.pos && el.area && D.areas[el.area]) el.pos = centro(D.areas[el.area]);
  const ok = el.tipo === 'ponto' ? !!el.pos : el.tipo === 'grupo' ? !!(el.pontos && el.pontos.length) : el.tipo === 'rua' ? !!(el.linhas && el.linhas.length) : !!(el.poligono && el.poligono.length >= 3);
  if (!ok) { console.warn('Elemento sem geometria:', el.id); return null; }
  POR_ID[el.id] = el;
  el.filhos = el.tipo === 'zona' ? (el.filhos || []).map(f => preparar(f, el)).filter(Boolean) : [];
  return el;
}
for (const e of C.elementos || []) { const p = preparar(e, null); if (p) ELEMENTOS.push(p); }

// ---------- mapa ----------
const map = L.map('map', { zoomControl: false, attributionControl: false, maxZoom: 20, minZoom: 14, zoomSnap: .25, zoomDelta: 1 });
L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.control.attribution({ position: 'bottomright', prefix: false }).addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>').addTo(map);
map.createPane('satBase').style.zIndex = 190;   // imagem fixa (reserva e fundo imediato)
map.createPane('sat').style.zIndex = 200;       // satélite em direto
map.createPane('mascara').style.zIndex = 390;
map.createPane('edificado').style.zIndex = 393; // camada opcional: lotes do cadastro municipal
map.createPane('ruasTodas').style.zIndex = 395; // camada opcional com todas as ruas
map.createPane('numeros').style.zIndex = 396;   // camada opcional: números de polícia
map.createPane('zonas').style.zIndex = 400;
map.createPane('ruas').style.zIndex = 410;
map.createPane('limite').style.zIndex = 420;
const limiteBounds = L.latLngBounds(LIMITE);
function margensGerais() { return { paddingTopLeft: [estreito() ? 16 : 40, 70], paddingBottomRight: [estreito() ? 16 : 40, 40] }; }
map.fitBounds(limiteBounds, margensGerais());
map.setMaxBounds(limiteBounds.pad(1.2));

// Satélite: imagem fixa por baixo (aparece logo e serve de reserva) e DGT em direto por cima.
L.imageOverlay(D.imagem.ficheiro, D.imagem.bounds, { pane: 'satBase', attribution: D.imagem.fonte }).addTo(map);
const DGT_URL = 'https://ortos.dgterritorio.gov.pt/wms/ortosat2023';
const dgt = L.tileLayer.wms(DGT_URL, { pane: 'sat', layers: 'ortoSat2023-CorVerdadeira', format: 'image/jpeg', version: '1.3.0', crs: L.CRS.EPSG3857, maxZoom: 20, tileSize: 512, attribution: 'Ortoimagens © <a href="https://www.dgterritorio.gov.pt" target="_blank" rel="noopener">DGT</a> 2023' });
let dgtOk = false, dgtErros = 0, emReserva = false;
function reserva(motivo) {
  if (emReserva) return; emReserva = true;
  map.removeLayer(dgt);
  map.setMaxZoom(18);
  console.info('Satélite em direto indisponível (' + motivo + '); a usar a imagem guardada.');
  aviso('Sem ligação ao satélite em direto da DGT: a usar a imagem guardada (DGT 2023, zoom limitado).', 6000);
}
if (navigator.onLine === false) setTimeout(() => reserva('offline'), 0); // adiado: o resto da página ainda está a ser montado
else {
  dgt.on('tileload', () => { dgtOk = true; });
  dgt.on('tileerror', () => { dgtErros++; if (!dgtOk && dgtErros >= 2) reserva('erro'); });
  dgt.addTo(map);
  setTimeout(() => { if (!dgtOk) reserva('tempo'); }, 15000);
}

// Máscara (exterior escurecido) e limite
const MUNDO = [[-89, -180], [-89, 180], [89, 180], [89, -180]];
L.polygon([MUNDO, LIMITE], { pane: 'mascara', stroke: false, fillColor: '#05070a', fillOpacity: .72, interactive: false }).addTo(map);
L.polyline(LIMITE, { pane: 'limite', color: '#ffffff', weight: 10, opacity: .35, className: 'limite-halo', interactive: false }).addTo(map);
L.polyline(LIMITE, { pane: 'limite', color: '#ffffff', weight: 2, opacity: .95, className: 'limite', interactive: false }).addTo(map);

// ---------- marcadores e geometrias dos pontos de interesse ----------
const vista = {}; // id -> { el, camadas, marcadores, linha, halo, poligono }
function icone(el, filho) {
  const cor = COR[filho ? 'ponto' : el.tipo], s = filho ? 13 : 18;
  return L.divIcon({ className: 'mk' + (filho ? ' filho' : ''), html: `<div class="mk-circ" style="--c:${cor}"></div>`, iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
}
function marcador(el, pos, filho, idx) {
  const m = L.marker(pos, { icon: icone(el, filho), riseOnHover: true, keyboard: false, bubblingMouseEvents: false, draggable: edicao });
  m.bindTooltip(el.nome, { direction: 'top', offset: [0, -12], className: 'rotulo', opacity: 1 });
  m.on('click', () => selecionar(el, false));
  if (edicao) ligarArrasto(m, el, idx || 0);
  return m;
}
function construir() {
  for (const id in vista) { vista[id].camadas.forEach(c => map.removeLayer(c)); delete vista[id]; }
  for (const el of ELEMENTOS) construirElemento(el);
  aplicarFiltro();
}
function construirElemento(el) {
  const v = { el, camadas: [], marcadores: [] };
  vista[el.id] = v;
  if (el.tipo === 'ponto') {
    const m = marcador(el, el.pos, !!el.pai); v.marcadores.push(m); v.camadas.push(m);
    if (!el.pai || edicao || todosPontos) m.addTo(map);
  } else if (el.tipo === 'grupo') {
    el.pontos.forEach((p, i) => { const m = marcador(el, p, false, i).addTo(map); v.marcadores.push(m); v.camadas.push(m); });
  } else if (el.tipo === 'rua') {
    const halo = L.polyline(el.linhas, { pane: 'ruas', color: COR.rua, weight: 16, opacity: .18, lineCap: 'round', bubblingMouseEvents: false }).addTo(map);
    const linha = L.polyline(el.linhas, { pane: 'ruas', color: COR.rua, weight: 4, opacity: .85, lineCap: 'round', bubblingMouseEvents: false }).addTo(map);
    halo.bindTooltip(el.nome, { sticky: true, className: 'rotulo', opacity: 1 }); linha.bindTooltip(el.nome, { sticky: true, className: 'rotulo', opacity: 1 });
    linha.on('click', () => selecionar(el, false)); halo.on('click', () => selecionar(el, false));
    v.camadas.push(halo, linha); v.linha = linha; v.halo = halo;
  } else if (el.tipo === 'zona') {
    const pol = L.polygon(el.poligono, { pane: 'zonas', color: COR.zona, weight: 2, opacity: .9, fillColor: COR.zona, fillOpacity: .12, dashArray: '6 5', bubblingMouseEvents: false }).addTo(map);
    pol.bindTooltip(el.nome, { sticky: true, className: 'rotulo', opacity: 1 });
    pol.on('click', () => selecionar(el, !edicao));
    v.camadas.push(pol); v.poligono = pol;
    for (const f of el.filhos) construirElemento(f);
  }
}
function limitesDe(el) {
  if (el.tipo === 'ponto') return L.latLngBounds([el.pos, el.pos]);
  if (el.tipo === 'grupo') return L.latLngBounds(el.pontos);
  if (el.tipo === 'rua') return L.latLngBounds(el.linhas.flat());
  return L.latLngBounds(el.poligono);
}
// margens do voo. Pontos e ruas: o cartão fica ao centro, por isso o alvo sobe um pouco.
// Zonas (e pontos dentro delas): o cartão encosta à direita e a zona cresce até ocupar grande parte do espaço livre.
// Em ecrãs estreitos o cartão ocupa a parte de baixo.
function margensVoo(el, encostar) {
  const W = window.innerWidth, H = window.innerHeight, zona = !!(el && (el.tipo === 'zona' || el.pai)) || !!encostar;
  if (estreito()) return { modo: 'baixo', paddingTopLeft: [20, 70], paddingBottomRight: [20, Math.round(H * .55)] };
  if (!zona) return { modo: 'centro', paddingTopLeft: [80, 80], paddingBottomRight: [80, 120] };
  // zona: o cartão encosta à direita (400 px) ou em baixo (até 38 % da altura), conforme o que deixa a zona maior
  const lado = { modo: 'lado', paddingTopLeft: [Math.round(W * .03), 66], paddingBottomRight: [Math.round(W * .02) + 414, 36], maxZoom: 20 };
  const baixo = { modo: 'baixo', paddingTopLeft: [24, 66], paddingBottomRight: [24, Math.round(H * .38) + 92], maxZoom: 20 };
  if (W < 900) return baixo;
  if (!el) return lado; // cartão sem elemento (categoria)
  const zoomCom = o => map.getBoundsZoom(limitesDe(el), false, L.point(o.paddingTopLeft).add(L.point(o.paddingBottomRight)));
  return zoomCom(lado) >= zoomCom(baixo) ? lado : baixo;
}

// ---------- camada opcional: todas as ruas, com nome ao longo da via ----------
const paneRuas = map.getPane('ruasTodas');
paneRuas.classList.add('pane-ruas', 'ruas-off');
const rendRuas = L.svg({ pane: 'ruasTodas', padding: .5 });
const RUAS_VISTA = []; // { rua, linhas, nomes }
let ruasLigadas = false, ruaHover = null, ruaDestaque = null;
function orientar(pts) { // o nome deve ler-se da esquerda para a direita (ou de baixo para cima nas ruas norte-sul)
  const a = pts[0], b = pts[pts.length - 1];
  const dx = (b[1] - a[1]) * Math.cos(a[0] * Math.PI / 180), dy = b[0] - a[0];
  const inverter = Math.abs(dx) >= Math.abs(dy) * .4 ? dx < 0 : dy < 0;
  return inverter ? pts.slice().reverse() : pts;
}
function construirRuas() {
  RUAS.forEach((rua, i) => {
    const r = { rua, linhas: [], nomes: [] };
    rua.trocos.forEach((troco, j) => {
      const pts = orientar(troco);
      const hit = L.polyline(pts, { renderer: rendRuas, pane: 'ruasTodas', className: 'rua-hit', interactive: true, weight: 14, opacity: 0 }).addTo(map);
      const linha = L.polyline(pts, { renderer: rendRuas, pane: 'ruasTodas', className: 'rua-linha', interactive: false }).addTo(map);
      linha._path.id = `rua-${i}-${j}`;
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('class', 'rua-nome'); txt.setAttribute('dy', '-5'); txt.setAttribute('text-anchor', 'middle');
      const tp = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
      tp.setAttribute('href', '#' + linha._path.id); tp.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + linha._path.id);
      tp.setAttribute('startOffset', '50%'); tp.textContent = rua.nome;
      txt.appendChild(tp); rendRuas._rootGroup.appendChild(txt);
      hit.on('mouseover', () => ruaSobre(r)); hit.on('mouseout', () => ruaSobre(null));
      hit.on('click', e => { L.DomEvent.stop(e); if (edicao && ferramenta === 'rua') criarRua(r); else destacarRua(r, false); });
      hit.bindTooltip(rua.nome, { sticky: true, className: 'rotulo', opacity: 1 });
      r.linhas.push(linha); r.nomes.push(txt);
    });
    RUAS_VISTA.push(r);
  });
  atualizarNomesRuas();
}
function classeRua(r, cls, ligar) { r.linhas.forEach(l => l._path.classList.toggle(cls, ligar)); r.nomes.forEach(t => t.classList.toggle(cls, ligar)); }
function ruaSobre(r) {

  ruaHover = r; if (r) classeRua(r, 'hover', true);
}

  onRemove(mapa) { mapa.off('moveend viewreset resize', this.desenhar, this); L.DomUtil.remove(this._canvas); },
  desenhar() {

});

// ---------- pesquisa com escrita preditiva ----------
const INDICE_PESQUISA = [];
function construirPesquisa() {
  INDICE_PESQUISA.length = 0;
  // cada entrada tem o nome completo e, nas vias, um alias sem o tipo («Saraiva de Carvalho» para «Rua Saraiva de Carvalho»)
  const PREFIXO = /^(rua|avenida|av\.|travessa|largo|praca|jardim|beco|calcada|estrada|alameda|escadinhas|patio|azinhaga|campo|rotunda|parque|mercado|igreja) (d[aeo]s? )?/;
  const add = (nome, tipo, acao, cor) => {
    const chave = normalizar(nome), m = chave.match(PREFIXO);
    const nomes = [nome], chaves = [chave];
    if (m && m[0].length < nome.length) { nomes.push(nome.slice(m[0].length)); chaves.push(chave.slice(m[0].length)); }
    INDICE_PESQUISA.push({ nome, chave, nomes, chaves, tipo, acao, cor });
  };
  const todos = []; (function rec(l) { for (const e of l) { todos.push(e); rec(e.filhos); } })(ELEMENTOS);
  for (const el of todos) add(el.nome, el.pai ? 'ponto' : el.tipo, () => selecionar(el, true), COR[el.pai ? 'ponto' : el.tipo]);
  const nomesPOI = new Set(todos.filter(e => e.tipo === 'rua').map(e => normalizar(e.nome)));
  for (const r of RUAS_VISTA) if (!nomesPOI.has(normalizar(r.rua.nome))) add(r.rua.nome, 'rua-osm', () => destacarRua(r, true));
  for (const c of C.categorias || []) add(c.nome, 'categoria', () => { alternarCategoria(c.id, true); mostrarCategoria(c); const b = limitesCategoria(c); if (b) map.flyToBounds(b, Object.assign({ duration: .9 }, margensGerais())); }, c.cor);
  INDICE_PESQUISA.sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
}
const ETQ = { ponto: 'lugar', grupo: 'conjunto', rua: 'rua', zona: 'zona', 'rua-osm': 'rua', categoria: 'categoria' };
const inp = $('#pesquisa'), ghost = $('#ghost'), sug = $('#sugestoes'), pesquisaBox = $('#pesquisa-box');
let resultados = [], ativo = -1;
function procurar(q) {
  const n = normalizar(q.trim()); if (!n) return [];
  const comeca = [], contem = [], palavra = [];
  for (const it of INDICE_PESQUISA) {
    if (it.chaves.some(c => c.startsWith(n))) comeca.push(it);
    else if (it.chave.split(/[\s\-–,()]+/).some(w => w.startsWith(n))) palavra.push(it);
    else if (it.chave.includes(n)) contem.push(it);
  }
  return comeca.concat(palavra, contem).slice(0, 9);
}
function realcar(nome, q) {
  const t = q.trim(), n = normalizar(nome), k = n.indexOf(normalizar(t));
  if (k < 0 || !t) return esc(nome);
  return esc(nome.slice(0, k)) + '<b>' + esc(nome.slice(k, k + t.length)) + '</b>' + esc(nome.slice(k + t.length));
}
function atualizarPesquisa() {
  const q = inp.value;
  pesquisaBox.classList.toggle('com-texto', q.length > 0);
  resultados = procurar(q); ativo = -1;
  // escrita preditiva: completa em cinzento com o primeiro resultado que começa pelo texto escrito
  let comp = null;
  if (q && !q.endsWith(' ')) for (const r of resultados) { const k = r.chaves.findIndex(c => c.startsWith(normalizar(q)) && c.length > q.length); if (k >= 0) { comp = r.nomes[k]; break; } }
  ghost.innerHTML = comp ? `<span>${esc(q)}</span>${esc(comp.slice(q.length))}` : '';
  ghost.dataset.completar = comp || '';
  if (!q.trim()) { sug.classList.remove('aberto'); sug.innerHTML = ''; return; }
  sug.innerHTML = resultados.length
    ? resultados.map((r, i) => `<button role="option" data-i="${i}"><span class="pinta ${r.tipo}" style="--c:${r.cor || '#ddd'}"></span><span>${realcar(r.nome, q)}</span><span class="etq">${ETQ[r.tipo]}</span></button>`).join('')
    : '<div class="nada">Nada encontrado.</div>';
  sug.classList.add('aberto');
}
function escolher(i) {
  const r = resultados[i]; if (!r) return;
  inp.value = r.nome; atualizarPesquisa(); sug.classList.remove('aberto'); inp.blur();
  r.acao();
}
function marcarAtivo(i) {
  ativo = i; sug.querySelectorAll('button').forEach((b, k) => b.classList.toggle('ativo', k === i));
  const b = sug.querySelector('button.ativo'); if (b) b.scrollIntoView({ block: 'nearest' });
}
inp.addEventListener('input', atualizarPesquisa);
inp.addEventListener('focus', () => { if (inp.value.trim()) atualizarPesquisa(); });
inp.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (resultados.length) marcarAtivo((ativo + 1) % resultados.length); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (resultados.length) marcarAtivo((ativo - 1 + resultados.length) % resultados.length); }
  else if ((e.key === 'Tab' || e.key === 'ArrowRight') && ghost.dataset.completar && inp.selectionStart === inp.value.length) { e.preventDefault(); inp.value = ghost.dataset.completar; atualizarPesquisa(); }
  else if (e.key === 'Enter') { e.preventDefault(); escolher(ativo >= 0 ? ativo : 0); }
  else if (e.key === 'Escape') { e.stopPropagation(); if (inp.value) { inp.value = ''; atualizarPesquisa(); } else inp.blur(); }
});
sug.addEventListener('mousedown', e => { const b = e.target.closest('button[data-i]'); if (b) { e.preventDefault(); escolher(+b.dataset.i); } });
$('#pesquisa-limpar').addEventListener('click', () => { inp.value = ''; atualizarPesquisa(); inp.focus(); });
inp.addEventListener('blur', () => setTimeout(() => sug.classList.remove('aberto'), 150));

// ---- visita guiada: lista de destaques (personalizável) ou membros de uma categoria ----
let passos = [], visitaAtual = null; // null = visita completa; senão, id da categoria
function visitaIds() { return Array.isArray(C.visita) ? C.visita.filter(id => POR_ID[id]) : ELEMENTOS.map(e => e.id); }
function listaVisita(catId) {
  if (catId) { const c = catPorId(catId); return c ? c.membros.map(id => POR_ID[id]).filter(Boolean) : []; }
  return visitaIds().map(id => POR_ID[id]).filter(Boolean);
}
function editarVisita(acao, id) {
  if (!Array.isArray(C.visita)) C.visita = visitaIds();
  const i = C.visita.indexOf(id);
  if (acao === 'tirar' && i >= 0) C.visita.splice(i, 1);
  else if (acao === 'por' && i < 0 && POR_ID[id]) C.visita.push(id);
  else if (acao === 'cima' && i > 0) { C.visita.splice(i, 1); C.visita.splice(i - 1, 0, id); }
  else if (acao === 'baixo' && i >= 0 && i < C.visita.length - 1) { C.visita.splice(i, 1); C.visita.splice(i + 1, 0, id); }
  else if (acao === 'repor') C.visita = undefined;

  marcarAlterado(); construirIndice();
}
const guiao = $('#guiao'), btnGuiao = $('#btn-guiao'), gSel = $('#g-sel');
let passo = -1;
function guiaoAberto() { return guiao.classList.contains('aberto'); }
function irPasso(i) {
  passos = listaVisita(visitaAtual);
  if (!passos.length) { aviso(visitaAtual ? 'Esta categoria ainda não tem elementos.' : 'A visita não tem destaques.', 3000); return; }
  passo = (i + passos.length) % passos.length;
  const el = passos[passo];
  if ((el.pai || el).oculto) { categoriasAtivas.clear(); aplicarFiltro(); }
  selecionar(el, true);
  const cat = visitaAtual && catPorId(visitaAtual);
  $('#g-texto').innerHTML = `${esc(el.nome)}<small>${passo + 1} de ${passos.length} · ${cat ? (cat.icone ? cat.icone + ' ' : '') + esc(cat.nome) : 'Visita completa'}</small>`;
}
function preencherSeletor() {
  gSel.innerHTML = '<option value="">Visita completa</option>' + C.categorias.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  gSel.value = visitaAtual || ''; gSel.style.display = C.categorias.length ? '' : 'none';

function ligarGuiao(ligar, catId) {
  if (ligar && edicao) { aviso('Sai do modo de edição para fazer a visita.', 2500); return; }
  if (ligar && !listaVisita(catId || null).length) { aviso(catId ? 'Esta categoria ainda não tem elementos.' : 'A visita não tem destaques.', 3000); return; }
  guiao.classList.toggle('aberto', ligar); document.body.classList.toggle('visita-aberta', ligar);
  btnGuiao.classList.toggle('on', ligar);
  btnGuiao.textContent = ligar ? '■ Sair da visita' : '▶ Visita guiada';
  if (ligar) {
    visitaAtual = catId || null; preencherSeletor(); abrirPainel(false);
    const lista = listaVisita(visitaAtual), i = selecionado ? lista.indexOf(selecionado) : -1;
    irPasso(i >= 0 ? i : 0);
  }
}
btnGuiao.addEventListener('click', () => ligarGuiao(!guiaoAberto()));
gSel.addEventListener('change', () => { visitaAtual = gSel.value || null; irPasso(0); });

$('#g-prev').addEventListener('click', e => { irPasso(passo - 1); e.currentTarget.blur(); }); // sem foco no botão, a tecla Espaço não avança dois passos
$('#g-next').addEventListener('click', e => { irPasso(passo + 1); e.currentTarget.blur(); });
document.addEventListener('keydown', e => {
  if (e.target && e.target.matches && e.target.matches('input, textarea, select')) { if (e.key === 'Escape' && edicao && ferramenta !== 'mover') { porFerramenta('mover'); e.target.blur(); } return; }
  if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.matches && e.target.matches('button, a')) return; // o botão trata da sua própria ativação
  if (e.key === 'Escape') {
    if (lightbox.classList.contains('aberto')) { lightbox.classList.remove('aberto'); return; }
    if (edicao && ferramenta !== 'mover') { porFerramenta('mover'); return; }
    if (cartaoAberto()) { fecharCartao(); categoriaAtual = null; return; }
    if (guiaoAberto()) { ligarGuiao(false); return; }
    if (selecionado || ruaDestaque) { desselecionar(); return; }
    if (categoriasAtivas.size) { categoriasAtivas.clear(); aplicarFiltro(); return; }
    if (painel.classList.contains('aberto')) abrirPainel(false);
    return;
  }
  if (e.key === '/' && !cartaoAberto()) { e.preventDefault(); inp.focus(); return; }
  if (!guiaoAberto()) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); irPasso(passo + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); irPasso(passo - 1); }

  if (e.key === 'End') irPasso(passos.length - 1);

function limpo(el) {

function redimensionar(file, max) { // devolve data URL da imagem reduzida (só quando não há servidor para a guardar)
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagem ilegível')); };
    img.src = url;
  });
}
async function adicionarFicheiros(el, ficheiros) {
  const comServidor = await verificarServidor();
  for (const f of ficheiros) {
    try {
      if (comServidor) {
        const r = await fetch('/guardar-foto/' + encodeURIComponent(f.name), { method: 'POST', body: f });
        const j = await r.json(); if (!r.ok) throw new Error(j.erro || r.statusText);
        el.fotos.push({ src: j.caminho, legenda: '' });
      } else el.fotos.push({ src: await redimensionar(f, 1600), legenda: '' });
    } catch (err) { aviso('Foto não adicionada: ' + err.message, 4000); }
  }
  marcarAlterado(); mostrarInfo(el, modal.classList.contains('lado') ? 'lado' : 'baixo');
}
modalConteudo.addEventListener('input', e => {
  if (!edicao) return;

  if (categoriaAtual && !selecionado) { // formulário de categoria
    const c = categoriaAtual;
    if (n === 'cat-nome') c.nome = t.value.trim() || c.nome; else if (n === 'cat-icone') c.icone = t.value.trim(); else if (n === 'cat-cor') c.cor = t.value; else return;
    marcarAlterado(); construirIndice(); clearTimeout(timerNome); timerNome = setTimeout(construirPesquisa, 400); return;
  }
  if (!selecionado) return;
  const el = selecionado;
  if (n === 'cat') { const c = catPorId(t.value); if (c) definirMembro(c, el, t.checked); return; }
  if (n === 'visita') { editarVisita(t.checked ? 'por' : 'tirar', el.id); return; }
  if (n === 'nome') { el.nome = t.value.trim() || el.nome; atualizarNome(el); }
  else if (n === 'icone') el.icone = t.value.trim();
  else if (n === 'texto') { const ps = t.value.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); el.texto = ps.length > 1 ? ps : (ps[0] || ''); }
  else if (n === 'foto-src' || n === 'foto-leg') {
    const i = +t.dataset.i; const f = el.fotos[i]; const o = typeof f === 'string' ? { src: f, legenda: '' } : f;
    if (n === 'foto-src') { o.src = t.value.trim(); const img = t.closest('.foto-ed').querySelector('img'); if (img) img.src = o.src; } else o.legenda = t.value;
    el.fotos[i] = o;
  } else return;
  marcarAlterado();
});

modalConteudo.addEventListener('click', async e => {
  if (!edicao) return;

  const b = e.target.closest('[data-ac]'); if (!b) return;

  else if (ac === 'negrito') envolver(ta, '<b>', '</b>', 'texto');

  else if (ac === 'foto-url') { const u = prompt('Endereço ou caminho da imagem (por exemplo assets/fotos/nome.jpg):'); if (u) { el.fotos.push({ src: u.trim(), legenda: '' }); marcarAlterado(); mostrarInfo(el, modal.classList.contains('lado') ? 'lado' : 'baixo'); } }
  else if (ac === 'subir') reordenar(el, -1);
  else if (ac === 'descer') reordenar(el, 1);
  else if (ac === 'apagar') apagar(el);
  else if (ac === 'concluir') fecharCartao();
});

  else if (ferramenta === 'ponto') novoPonto(e.latlng);

});
map.on('dblclick', e => { if (edicao && ferramenta === 'poligono') { L.DomEvent.stop(e); terminarZona(desenho.slice(0, -1)); } });
map.on('mousedown', e => { if (edicao && ferramenta === 'pincel') { aPintar = true; desenho = [e.latlng]; } });
map.on('mousemove', e => { if (aPintar) { desenho.push(e.latlng); atualizarTemp(); } });
L.DomEvent.on(document, 'mouseup', () => { if (aPintar) terminarPincel(); }); // largar o rato fora do mapa também termina a zona
function terminarPincel() {
  if (!aPintar) return; aPintar = false;
  const pts = L.LineUtil.simplify(desenho.map(ll => map.latLngToLayerPoint(ll)), 4).map(p => map.layerPointToLatLng(p));
  terminarZona(pts);
}
// pincel com o dedo (o Leaflet não traduz toques em mousedown/mousemove)
const contentor = map.getContainer();
contentor.addEventListener('touchstart', e => { if (edicao && ferramenta === 'pincel' && e.touches.length === 1) { aPintar = true; desenho = [map.mouseEventToLatLng(e.touches[0])]; e.preventDefault(); } }, { passive: false });
contentor.addEventListener('touchmove', e => { if (aPintar && e.touches.length) { desenho.push(map.mouseEventToLatLng(e.touches[0])); atualizarTemp(); e.preventDefault(); } }, { passive: false });
contentor.addEventListener('touchend', () => { if (aPintar) terminarPincel(); });
