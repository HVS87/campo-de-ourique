<script>
// Carrega só os dados da freguesia escolhida: ?freguesia=<id> no endereço, ou a última usada neste browser, ou Campo de Ourique.
// Campo de Ourique tem os dados em dados/; as outras em dados/freguesias/<id>/ (geradas por tools/freguesias.mjs).
(function () {
  var lista = window.FREGUESIAS || [], CO = 'campo-de-ourique';
  var pedida = new URLSearchParams(location.search).get('freguesia'), guardada = null;
  try { guardada = localStorage.getItem('co-freguesia'); } catch (e) { /* sem armazenamento local */ }
  var existe = function (id) { return !!id && (id === CO || lista.some(function (f) { return f.id === id; })); };
  var id = existe(pedida) ? pedida : existe(guardada) ? guardada : CO;
  var base = id === CO ? 'dados/' : 'dados/freguesias/' + id + '/';
  window.FREGUESIA = Object.assign({ id: id, nome: id }, lista.find(function (f) { return f.id === id; }) || {}, { base: base });
  try { localStorage.setItem('co-freguesia', id); } catch (e) { /* sem armazenamento local */ }
  var ficheiros = ['geo.js', 'ruas.js', 'edificado.js', 'verdes.js', 'conteudos.js', 'presets/index.js'];
  var carregados = ficheiros.map(function (f) { // descarregam em paralelo e executam por ordem (async = false)
    return new Promise(function (ok) { var s = document.createElement('script'); s.src = base + f; s.async = false; s.onload = ok; s.onerror = function () { console.warn('Não foi possível carregar ' + base + f); ok(); }; document.head.appendChild(s); });
  });
  window.__dados = Promise.all(carregados).then(function () { return new Promise(function (ok) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ok); else ok(); }); });
})();
</script>
<style>
  :root {
    --bg: #0f1216; --panel: rgba(18, 22, 28, .94); --panel-border: rgba(255,255,255,.12);
    --ink: #eef1f5; --ink-dim: #a6afbb; --accent: #f3c35b; --accent-ink: #1a1405;
    --ponto: #9aa3ad; /* as cores de cada elemento vêm da prioridade (PRIORIDADES no script) */
    --radius: 14px; --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --painel-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #map { position: absolute; inset: 0; background: #0b0d10; }
  button { font: inherit; }
  .vidro { background: var(--panel); border: 1px solid var(--panel-border); box-shadow: 0 10px 30px rgba(0,0,0,.45); } /* sem backdrop-filter: com fundo a 94 % não se via e custava imagens por segundo ao mover o mapa */
  .redondo { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); cursor: pointer; font-size: 18px; padding: 0; }
  .redondo:hover { background: rgba(40,46,56,.96); }
  .redondo.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* ---- barra superior: índice, título, pesquisa ---- */
  #btn-painel { position: absolute; top: 14px; left: 14px; z-index: 1001; }
  #marca { position: absolute; top: 14px; left: 66px; z-index: 1000; height: 42px; display: flex; align-items: center; padding: 0 16px 0 14px; border-radius: 21px; pointer-events: none; }
  #marca b { font-size: 15px; letter-spacing: .3px; }
  #marca small { color: var(--ink-dim); font-size: 12px; margin-left: 8px; }
  #pesquisa-box { position: absolute; top: 14px; right: 66px; z-index: 1060; width: 300px; transition: width .2s; }
  #pesquisa-box .campo { position: relative; height: 42px; border-radius: 21px; display: flex; align-items: center; }
  #pesquisa-box .lupa { position: absolute; left: 13px; top: 11px; width: 18px; height: 18px; color: var(--ink-dim); pointer-events: none; }
  #pesquisa, #ghost { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0 38px 0 40px; border: 0; border-radius: 21px; font: inherit; font-size: 14px; background: transparent; }
  #pesquisa { color: var(--ink); outline: none; z-index: 2; }
  #pesquisa::placeholder { color: var(--ink-dim); }
  #ghost { color: var(--ink-dim); white-space: pre; overflow: hidden; display: flex; align-items: center; z-index: 1; pointer-events: none; opacity: .75; }
  #ghost span { visibility: hidden; }
  #pesquisa-limpar { position: absolute; right: 8px; top: 7px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-dim); cursor: pointer; display: none; z-index: 3; }
  #pesquisa-box.com-texto #pesquisa-limpar { display: block; }
  #pesquisa-limpar:hover { background: rgba(255,255,255,.1); color: var(--ink); }
  #sugestoes { margin-top: 6px; border-radius: var(--radius); display: none; max-height: min(60vh, 420px); overflow-y: auto; }
  #sugestoes.aberto { display: block; }
  #sugestoes button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 13.5px; }
  #sugestoes button:hover, #sugestoes button.ativo { background: rgba(255,255,255,.08); }
  #sugestoes button b { font-weight: 600; color: var(--accent); }
  #sugestoes .etq { margin-left: auto; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-dim); flex: none; }
  #sugestoes .nada { padding: 10px 14px; color: var(--ink-dim); font-size: 13px; }
  .pinta { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .pinta.rua, .pinta.zona { border-radius: 2px; }
  .pinta.rua-osm { background: transparent; border-top: 2px solid #ddd; height: 0; width: 10px; border-radius: 0; }

  /* ---- painel esquerdo colapsável: índice ---- */
  #painel { position: absolute; top: 0; left: 0; bottom: 0; z-index: 1000; width: var(--painel-w); display: flex; flex-direction: column; border-radius: 0; border-width: 0 1px 0 0; transform: translateX(-100%); transition: transform .25s; }
  #painel.aberto { transform: none; }
  #painel header { padding: 70px 18px 12px; border-bottom: 1px solid var(--panel-border); }
  #painel h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
  .titulo-linha { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .btn.freguesia { flex: none; padding: 5px 9px; font-size: 12px; margin-top: 1px; }
  .lista-freguesias { margin-top: 10px; max-height: 46vh; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; }
  .lista-freguesias[hidden] { display: none; }
  .lista-freguesias button { text-align: left; font-size: 12.5px; padding: 6px 8px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; }
  .lista-freguesias button:hover { background: rgba(255,255,255,.08); }
  .lista-freguesias button.atual { border-color: rgba(243,195,91,.6); color: var(--accent); font-weight: 600; cursor: default; }
  .lista-freguesias .a-carregar { opacity: .6; }
  @media (pointer: coarse) { .lista-freguesias button { min-height: 40px; } }
  #painel h1 small { display: block; font-weight: 400; color: var(--ink-dim); font-size: 12.5px; margin-top: 3px; }
  .acoes { display: flex; gap: 6px; padding: 12px 12px 4px; flex-wrap: wrap; }
  .btn { font-size: 12.5px; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--panel-border); background: rgba(255,255,255,.06); color: var(--ink); cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #indice { padding: 8px 10px 16px; display: grid; gap: 2px; overflow: auto; align-content: start; }
  #indice h3 { margin: 10px 8px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); font-weight: 600; }
  #indice button { text-align: left; font-size: 13px; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: center; }
  #indice button:hover { background: rgba(255,255,255,.06); }
  #indice button.sel { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
  #indice button.filho { padding-left: 28px; font-size: 12.5px; color: var(--ink-dim); }
  #indice .vazio { color: var(--ink-dim); padding: 8px; font-size: 12px; line-height: 1.4; }
  #indice .ico { width: 20px; text-align: center; flex: none; }
  .rodape { margin-top: auto; padding: 10px 14px 12px; border-top: 1px solid var(--panel-border); color: var(--ink-dim); font-size: 12px; line-height: 1.45; }
  .preset-vista { margin-top: auto; padding: 8px 14px; border-top: 1px solid var(--panel-border); font-size: 12px; color: var(--ink-dim); }
  .preset-vista label { display: flex; align-items: center; gap: 8px; }
  .preset-vista .seletor { flex: 1; min-width: 0; }
  .preset-vista + .rodape { margin-top: 0; }
  .rodape a { color: #ccc; }

  /* ---- canto inferior esquerdo: zoom e camada de ruas ---- */
  .leaflet-bottom.leaflet-left { margin: 0 0 calc(14px + env(safe-area-inset-bottom, 0px)) 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 8px; } /* cada controlo com a sua largura (sem isto, o zoom esticava até à do botão «Camadas») */
  .leaflet-bottom.leaflet-left .leaflet-control { margin: 0; }
  .leaflet-bar { border: 1px solid var(--panel-border) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45) !important; }
  .leaflet-bar a { width: 36px !important; height: 36px !important; line-height: 36px !important; background: var(--panel) !important; color: var(--ink) !important; border-color: var(--panel-border) !important; }
  .leaflet-bar a:hover { background: rgba(40,46,56,.96) !important; }
  /* painel de camadas, colapsável (fechado ao arrancar) */
  #camadas { display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
  #btn-camadas { height: 38px; padding: 0 14px 0 12px; border-radius: 19px; display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; font-size: 12.5px; }
  #btn-camadas:hover { background: rgba(40,46,56,.96); }
  #btn-camadas.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #btn-camadas svg { width: 16px; height: 16px; }
  #btn-camadas .conta { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 12px; font-weight: 700; display: none; place-items: center; background: var(--accent); color: var(--accent-ink); }
  #btn-camadas.algumas .conta { display: grid; } #btn-camadas.on .conta { background: #1a1405; color: var(--accent); }
  #lista-camadas { display: none; flex-direction: column; border-radius: var(--radius); padding: 6px; min-width: 230px; }
  #lista-camadas.aberto { display: flex; }
  #lista-camadas h4 { margin: 4px 8px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); font-weight: 600; }
  .camada { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 9px; border: 0; background: transparent; color: var(--ink); cursor: pointer; font-size: 13px; white-space: nowrap; text-align: left; }
  .camada:hover { background: rgba(255,255,255,.07); }
  .camada.on { color: #fff; }
  .camada .inter { width: 28px; height: 16px; border-radius: 8px; background: rgba(255,255,255,.18); position: relative; flex: none; transition: background .15s; }
  .camada .inter::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
  .camada.on .inter { background: var(--accent); } .camada.on .inter::after { left: 14px; background: #1a1405; }
  .camada small { color: var(--ink-dim); font-size: 11px; margin-left: auto; padding-left: 10px; }
  /* números de polícia e lotes */
  .leaflet-numeros-pane { pointer-events: none; }
  .num-canvas { position: absolute; left: 0; top: 0; }
  .leaflet-control-attribution { background: rgba(0,0,0,.75) !important; color: #ccc !important; font-size: 11px; }
  .leaflet-control-attribution a { color: #e8e8e8 !important; }

  /* ---- limite ---- */
  .leaflet-interactive:focus:not(:focus-visible) { outline: none; }
  .leaflet-interactive:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .limite { filter: drop-shadow(0 0 6px rgba(255,255,255,.55)); }
  .limite-halo { filter: blur(6px); }

  /* ---- marcadores: círculos, pulsantes ao passar o cursor ---- */
  .mk { position: relative; }
  .mk-circ { position: absolute; inset: 0; border-radius: 50%; background: var(--c, var(--ponto)); border: 2px solid rgba(20,20,20,.9); box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 2px 8px rgba(0,0,0,.6); transition: transform .15s; }
  .mk-circ::before, .mk-circ::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--c, var(--ponto)); opacity: 0; }
  .mk:hover .mk-circ { transform: scale(1.15); }
  .mk:hover .mk-circ::before, .mk.sel .mk-circ::before { animation: pulso 1.6s ease-out infinite; }
  .mk:hover .mk-circ::after, .mk.sel .mk-circ::after { animation: pulso 1.6s ease-out .8s infinite; }
  @keyframes pulso { 0% { transform: scale(.7); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
  .mk.sel .mk-circ { box-shadow: 0 0 0 3px #fff, 0 2px 10px rgba(0,0,0,.7); }
  /* prioridades: o preto leva contorno e anéis claros; o branco e o amarelo, contorno escuro */
  .mk.pri-urgente .mk-circ { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.6); }
  .mk.pri-urgente .mk-circ::before, .mk.pri-urgente .mk-circ::after { border-color: #fff; }
  .mk.pri-urgente.sel .mk-circ { box-shadow: 0 0 0 3px #fff, 0 0 0 5px #000, 0 2px 10px rgba(0,0,0,.7); }
  .mk.pri-sugestao .mk-circ, .mk.pri-preocupante .mk-circ { border-color: rgba(0,0,0,.85); }
  /* ondas de ruas e zonas ao passar o cursor (como o pulsar dos pontos) */
  path.eco { pointer-events: none; }
  path.eco-rua.pulsar { animation: eco-rua 1.6s ease-out infinite; }
  path.eco-zona.pulsar { animation: eco-zona 1.6s ease-out infinite; }
  path.eco.eco-1.pulsar { animation-delay: .8s; }
  @keyframes eco-rua { 0% { stroke-opacity: .85; stroke-width: 5px; } 100% { stroke-opacity: 0; stroke-width: 34px; } }
  @keyframes eco-zona { 0% { stroke-opacity: .9; stroke-width: 2px; } 100% { stroke-opacity: 0; stroke-width: 26px; } }
  @media (prefers-reduced-motion: reduce) {
    path.eco.pulsar { animation: none; stroke-opacity: .45; stroke-width: 12px; }
    .mk:hover .mk-circ::before, .mk:hover .mk-circ::after, .mk.sel .mk-circ::before, .mk.sel .mk-circ::after { animation: none; }
  }
  path.pri-urgente { filter: drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 3px rgba(255,255,255,.5)); }
  path.pri-sugestao, path.pri-preocupante { filter: drop-shadow(0 0 1.5px rgba(0,0,0,.85)); }
  .pri-etq { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--c); color: #1a1405; font-weight: 700; letter-spacing: .4px; }
  .pri-etq.clara { color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.5); }
  /* legenda das prioridades, colapsável (fechada ao arrancar), no canto inferior direito */
  #legenda { display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 8px; }
  #btn-legenda { height: 34px; padding: 0 12px 0 10px; border-radius: 17px; display: flex; align-items: center; gap: 8px; color: var(--ink); cursor: pointer; font-size: 12.5px; }
  #btn-legenda:hover { background: rgba(40,46,56,.96); }
  #btn-legenda.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  #btn-legenda .amostras { display: flex; gap: 2px; }
  #btn-legenda .amostras i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.5); }
  #lista-legenda { display: none; border-radius: var(--radius); padding: 8px 12px 10px; min-width: 210px; }
  #lista-legenda.aberto { display: block; }
  #lista-legenda h4 { margin: 2px 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); font-weight: 600; }
  #lista-legenda .leg { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 3px 0; }
  #lista-legenda .leg .pinta { width: 12px; height: 12px; }
  #lista-legenda .leg small { margin-left: auto; padding-left: 12px; color: var(--ink-dim); font-size: 12px; }
  .leaflet-bottom.leaflet-right { margin: 0 14px calc(4px + env(safe-area-inset-bottom, 0px)) 0; }
  .leaflet-bottom.leaflet-right .leaflet-control-attribution { margin: 8px 0 0; }
  .rotulo { background: rgba(10,12,16,.88); color: #fff; padding: 3px 9px; border-radius: 7px; font-size: 12px; white-space: nowrap; border: 1px solid rgba(255,255,255,.15); pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .rotulo::before { display: none; }

  /* ---- camada de ruas (opcional) ---- */
  .pane-ruas .rua-linha { stroke: rgba(255,255,255,.55); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s, stroke-width .15s; }
  .pane-ruas .rua-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  .pane-ruas .rua-linha.hover, .pane-ruas .rua-linha.destaque { stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 5px rgba(243,195,91,.7)); }
  .pane-ruas .rua-nome { font: 600 12px/1 var(--font); fill: #fff; letter-spacing: .4px; paint-order: stroke fill; stroke: rgba(0,0,0,.85); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .pane-ruas.z17 .rua-nome { opacity: .95; }
  .pane-ruas .rua-nome.curto { opacity: 0 !important; }
  .pane-ruas .rua-nome.hover, .pane-ruas .rua-nome.destaque { opacity: 1 !important; fill: var(--accent); font-size: 13px; }
  .pane-ruas.ruas-off .rua-linha:not(.destaque), .pane-ruas.ruas-off .rua-nome:not(.destaque) { opacity: 0 !important; }
  .pane-ruas.ruas-off .rua-hit { pointer-events: none; }
  /* sobre o mapa da cidade (fundo claro) as linhas das ruas ficam escuras */
  body.fundo-mapa .pane-ruas .rua-linha:not(.hover):not(.destaque) { stroke: rgba(30,34,40,.55); }
  .rotulo.verde b { color: #9be38a; }

  /* ---- cartão central ---- */
  #modal { position: absolute; inset: 0; z-index: 1100; background: rgba(0,0,0,.42); display: none; place-items: center; padding: 20px 20px 90px; }
  #modal.aberto { display: grid; }
  #modal.lado, #modal.baixo { background: transparent; pointer-events: none; }
  #modal.lado { justify-items: end; padding: 70px 14px 14px; }
  #modal.lado .cartao { pointer-events: auto; width: min(400px, 100%); animation-name: surgir-lado; }
  #modal.baixo { justify-items: center; align-items: end; padding: 12px 12px 80px; }
  #modal.baixo .cartao { pointer-events: auto; width: min(600px, 100%); max-height: 38vh; }
  @keyframes surgir-lado { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  #modal .cartao { position: relative; width: min(600px, 100%); max-height: 100%; overflow: auto; border-radius: 18px; padding: 22px 26px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.65); animation: surgir .22s ease-out; }
  @keyframes surgir { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .fechar { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.06); border: 0; color: var(--ink-dim); font-size: 16px; cursor: pointer; }
  .fechar:hover { background: rgba(255,255,255,.14); color: var(--ink); }
  .info h2 { margin: 0 36px 4px 0; font-size: 23px; line-height: 1.2; display: flex; gap: 10px; align-items: center; }
  .info h2 .pinta { width: 12px; height: 12px; }
  .info .tipo { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); margin: 0 0 14px 22px; }
  .info .tipo a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .info .texto { font-size: 15px; line-height: 1.55; color: #d8dde5; }
  .info .texto p { margin: 0 0 10px; }
  .info .texto ul { margin: -4px 0 10px; padding-left: 22px; }
  .info .texto li { margin: 3px 0; }
  .info .texto a { color: var(--accent); }
  .fotos { display: grid; gap: 10px; margin: 0 0 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .fotos figure { margin: 0; }
  .fotos img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; cursor: zoom-in; background: #1a1f27; }
  .fotos figcaption { font-size: 12px; color: var(--ink-dim); margin-top: 4px; line-height: 1.4; }
  .filhos { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--panel-border); }

  /* ---- lightbox ---- */

  /* ---- modo de edição ---- */

  #barra-edicao { display: none; position: absolute; left: 50%; top: 66px; transform: translateX(-50%); z-index: 1050; border-radius: var(--radius); padding: 8px 10px; width: min(760px, 94vw); font-size: 12.5px; }
  #barra-edicao.aberto { display: block; }

  #barra-edicao .row.preset { border-top: 1px solid var(--panel-border); padding-top: 6px; }

  #barra-edicao .estado.auto { font-size: 11px; }
  #barra-edicao .estado-central { font-size: 11px; color: var(--ink-dim); }
  #barra-edicao .estado-central.pendente { color: #ffc27a; }
  #barra-edicao input.titulo { font: inherit; font-size: 12.5px; background: rgba(255,255,255,.06); border: 1px solid var(--panel-border); color: var(--ink); border-radius: 8px; padding: 6px 9px; width: 200px; }
  #barra-edicao input.titulo.sub { width: 240px; }
  .btn.perigo { border-color: rgba(255,120,120,.45); color: #ff9b9b; }

  .btn:disabled { opacity: .45; cursor: default; }
  #map.desenhar { cursor: crosshair; }
  /* com uma ferramenta de criar, as zonas e as ruas destacadas deixam passar o clique para o mapa (pontos dentro de zonas, ruas e lotes por baixo) */
  #map.desenhar .leaflet-zonas-pane path, #map.desenhar .leaflet-ruas-pane path { pointer-events: none; }
  body.edicao .mk { cursor: grab; }

  /* o ponto «mergulha» na zona sobre a qual está a ser arrastado */

  /* vértices das zonas */

  /* formulário do cartão */
  .form-edicao .tipo-ed { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-dim); margin: 2px 36px 4px 0; }

  #sem-servidor { display: none; color: #ffb86b; font-size: 11.5px; padding: 4px 2px 0; }

  /* ---- competência (quem tem de resolver) no cartão ---- */

  /* ---- diálogo (guardar ou descartar, presets de outras freguesias) ---- */

  #dialogo .campo-dialogo { display: block; font-size: 12.5px; color: var(--ink-dim); margin: 4px 0 6px; }

  #map.modo-cidade .leaflet-ruasTodas-pane, #map.modo-cidade .leaflet-numeros-pane, #map.modo-cidade .leaflet-edificado-pane,
  #map.modo-cidade .leaflet-marker-pane, #map.modo-cidade .leaflet-satBase-pane { display: none; }
  body.cidade #legenda, body.cidade #camadas, body.cidade #btn-editar, body.cidade #btn-painel, body.cidade #painel, body.cidade #desmat, body.cidade #guiao { display: none !important; }
  #btn-cidade { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); cursor: pointer; padding: 0; }

  #btn-cidade:hover { background: rgba(40,46,56,.96); }
  #btn-cidade.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  body.edicao #btn-cidade { display: none; }
  .rotulo-freg { background: transparent; border: 0; box-shadow: none; color: #fff; font: 700 12px/1.15 var(--font); letter-spacing: .2px; text-align: center; text-shadow: 0 0 3px #000, 0 0 7px #000, 0 1px 2px #000; white-space: normal; width: 104px; padding: 0; pointer-events: none; }

  #desmat-pilha { position: relative; width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
  #desmat.varios #desmat-pilha .mk-circ { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 4px 4px 0 1px rgba(28,32,38,.95), 4px 4px 0 3px rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.6); }
  #desmat-pilha .conta { position: absolute; top: -3px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px; background: var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 700; display: none; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none; }
  #desmat.varios #desmat-pilha .conta { display: grid; }
  #desmat.expandido #desmat-pilha .mk-circ { transform: scale(.88); }
  #desmat-lista { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-top: 4px; padding: 4px 2px 8px 10px; max-height: calc(100dvh - var(--topo) - 170px); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: thin; visibility: hidden; transition: visibility 0s .45s; }
  #desmat.expandido #desmat-lista { visibility: visible; transition-delay: 0s; }
  #desmat-lista .item { display: flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; font: inherit; opacity: 0; pointer-events: none;
    transform: translateY(calc(min(var(--i) + 1, 8) * -44px)) scale(.5); transition: opacity .2s, transform .3s cubic-bezier(.2, .8, .3, 1.15); transition-delay: calc((var(--n) - var(--i) - 1) * 22ms); }
  #desmat.expandido #desmat-lista .item { opacity: 1; transform: none; pointer-events: auto; transition-delay: calc(var(--i) * 40ms); }
  #desmat-lista .nome { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; white-space: nowrap; max-width: min(240px, 58vw); overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 12px rgba(0,0,0,.4); }

  /* ---- ecrãs médios (tablet) e estreitos (telemóvel) ---- */

  /* em edição, o cartão à direita começa abaixo da barra de ferramentas para não lhe tapar o fim das linhas */

<script>
window.__dados.then(function () {
'use strict';
const FREG = window.FREGUESIA || { id: 'campo-de-ourique', nome: 'Campo de Ourique', base: 'dados/' }; // freguesia carregada
const BASE = FREG.base, CO = FREG.id === 'campo-de-ourique';
const D = window.MAPA_DADOS;
const C = window.CONTEUDOS || {};
const RUAS = window.RUAS_OSM || [];
const LIMITES = [D.limite, ...(D.limitesExtra || [])]; // algumas freguesias têm mais de uma parte (por exemplo Alcântara)
const FONTE_RUAS = D.fonteRuas || 'OSM';
const qsFreguesia = '?freguesia=' + encodeURIComponent(FREG.id); // para os pedidos de gravação ao servidor local
// cor de cada elemento: pela prioridade (campo «prioridade»); sem classificação fica cinzento neutro
const PRIORIDADES = [
  { id: 'urgente', nome: 'Problema urgente', cor: '#111111' },
  { id: 'importante', nome: 'Situação importante', cor: '#e53935', etq: '#c62828' }, // etq: fundo da etiqueta do cartão (o vermelho do mapa não chega ao contraste 4,5:1)
  { id: 'preocupante', nome: 'Situação preocupante', cor: '#fdd835' },
  { id: 'pouco', nome: 'Pouco preocupante', cor: '#43a047' },
  { id: 'sugestao', nome: 'Sugestão', cor: '#f5f5f5' },
];
const SEM_PRIORIDADE = { id: 'sem', nome: 'Sem classificação', cor: '#9aa3ad' };
const PRI = Object.fromEntries(PRIORIDADES.map(p => [p.id, p]));
const priDe = el => PRI[el && el.prioridade] || SEM_PRIORIDADE;
const corDe = el => priDe(el).cor;
const TIPO = { ponto: 'Ponto', grupo: 'Conjunto de pontos', rua: 'Rua', zona: 'Zona', desmaterializado: 'Ponto desmaterializado' };
const ordemPri = el => { const i = PRIORIDADES.findIndex(p => p.id === (el && el.prioridade)); return i < 0 ? 99 : i; };
// competência: quem tem de resolver (campo «competencia»)
const COMPETENCIAS = [{ id: 'governo', nome: 'Governo' }, { id: 'camara', nome: 'Câmara Municipal' }, { id: 'junta', nome: 'Junta de Freguesia' }];
const COMP = Object.fromEntries(COMPETENCIAS.map(c => [c.id, c]));
const EDITOR = new URLSearchParams(location.search).has('editor');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normalizar = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); // sem acentos nem maiúsculas
const corEscura = hex => { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); if (!m) return false; const [r, g, b] = m.slice(1).map(h => parseInt(h, 16) / 255); return .2126 * r + .7152 * g + .0722 * b < .45; }; // para pôr texto claro em chips de cor escura

// ---------- elementos ----------
function centro(pts) { let a = 0, b = 0; for (const p of pts) { a += p[0]; b += p[1]; } return [a / pts.length, b / pts.length]; }

const POR_ID = {};

  if (pai && el.tipo !== 'ponto') { console.warn('Só pontos podem ser filhos de uma zona:', el.id); return null; }

  if (el.tipo === 'rua' && !el.linhas) {
    let linhas = D.ruas[el.rua || el.nome];
    if (!linhas) { const r = RUAS.find(x => x.nome === (el.rua || el.nome)); if (r) linhas = r.trocos; }
    if (linhas) el.linhas = linhas.map(l => l.map(p => p.slice()));

  if (el.prioridade && !PRI[el.prioridade]) { console.warn('Prioridade desconhecida:', el.id, el.prioridade); delete el.prioridade; }
  if (el.competencia && !COMP[el.competencia]) { console.warn('Competência desconhecida:', el.id, el.competencia); delete el.competencia; }
  if (el.tipo === 'desmaterializado') { delete el.pos; delete el.area; } // sem lugar no mapa
  if (el.tipo === 'ponto' && !el.pos && el.area && D.areas[el.area]) el.pos = centro(D.areas[el.area]);
  const ok = el.tipo === 'desmaterializado' ? true : el.tipo === 'ponto' ? !!el.pos : el.tipo === 'grupo' ? !!(el.pontos && el.pontos.length) : el.tipo === 'rua' ? !!(el.linhas && el.linhas.length) : !!(el.poligono && el.poligono.length >= 3);
  if (!ok) { console.warn('Elemento sem geometria:', el.id); return null; }
  POR_ID[el.id] = el;
  el.filhos = el.tipo === 'zona' ? (el.filhos || []).map(f => preparar(f, el)).filter(Boolean) : [];
  return el;
}
for (const e of C.elementos || []) { const p = preparar(e, null); if (p) ELEMENTOS.push(p); }

// ---------- mapa ----------
const map = L.map('map', { zoomControl: false, attributionControl: false, maxZoom: 20, minZoom: 10, zoomSnap: .25, zoomDelta: 1 });
L.control.zoom({ position: 'bottomleft', zoomInTitle: 'Aproximar', zoomOutTitle: 'Afastar' }).addTo(map);
// botão do mapa geral de Lisboa (logo acima do zoom)
const CtrlCidade = L.Control.extend({ onAdd() {
  const b = L.DomUtil.create('button', 'vidro'); b.id = 'btn-cidade'; b.type = 'button'; b.title = 'Mapa de Lisboa: todas as freguesias';
  b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', 'false');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 9.5 7.5 5l5 1.5L17 4l4 3.5-1 5.5 1 5-5.5 2-4-2-5 1.5L3 16l1-3.5z"/><path d="M7.5 5 9 11l-5 1.5M9 11l5 .5 3-7.5M14 11.5l1.5 8.5M14 11.5l6 1.5"/></svg>';
  L.DomEvent.disableClickPropagation(b);
  b.addEventListener('click', () => abrirCidade());
  return b;
} });
new CtrlCidade({ position: 'bottomleft' }).addTo(map);
L.control.attribution({ position: 'bottomright', prefix: false }).addAttribution(CO ? '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' : 'Limites, ruas e edificado © <a href="https://geodados-cml.hub.arcgis.com/" target="_blank" rel="noopener">Câmara Municipal de Lisboa</a>').addTo(map);
map.createPane('edificado').style.zIndex = 393; // camadas opcionais: lotes do cadastro e espaços verdes (um só canvas, para ambas responderem ao cursor)
map.createPane('satBase').style.zIndex = 190;   // imagem fixa (reserva e fundo imediato)
map.createPane('sat').style.zIndex = 200;       // satélite em direto
map.createPane('mascara').style.zIndex = 390;
map.createPane('ruasTodas').style.zIndex = 395; // camada opcional com todas as ruas
map.createPane('numeros').style.zIndex = 396;   // camada opcional: números de polícia
map.createPane('zonas').style.zIndex = 400;
map.createPane('ruas').style.zIndex = 410;
map.createPane('limite').style.zIndex = 420;
map.createPane('cidade').style.zIndex = 430;    // mapa geral de Lisboa (as 24 freguesias)
const limiteBounds = L.latLngBounds(LIMITES.flat());
function margensGerais() { return { paddingTopLeft: [estreito() ? 16 : 40, 70], paddingBottomRight: [estreito() ? 16 : 40, 40] }; }
map.fitBounds(limiteBounds, margensGerais());
// zoom mínimo: um pouco abaixo da vista geral (as freguesias grandes, num telemóvel, precisam de menos de 14); mais longe é o mapa de Lisboa
const MIN_ZOOM = Math.min(14, Math.floor((map.getZoom() - .5) * 4) / 4);
map.setMinZoom(MIN_ZOOM);
// até onde se pode arrastar o mapa: folgado, para o voo poder pôr uma zona da orla acima do cartão num telemóvel ao alto
const LIMITE_MOVER = 3;
map.setMaxBounds(limiteBounds.pad(LIMITE_MOVER));

// Satélite: imagem fixa por baixo (aparece logo e serve de reserva) e DGT em direto por cima.
const fixa = L.imageOverlay(D.imagem.ficheiro, D.imagem.bounds, { pane: 'satBase', attribution: D.imagem.fonte }).addTo(map);
const DGT_URL = 'https://ortos.dgterritorio.gov.pt/wms/ortosat2023';
const dgt = L.tileLayer.wms(DGT_URL, { pane: 'sat', layers: 'ortoSat2023-CorVerdadeira', format: 'image/jpeg', version: '1.3.0', crs: L.CRS.EPSG3857, maxZoom: 20, tileSize: 512, attribution: 'Ortoimagens © <a href="https://www.dgterritorio.gov.pt" target="_blank" rel="noopener">DGT</a> 2023' });
let dgtOk = false, dgtErros = 0, emReserva = false;
function reserva(motivo) {
  if (emReserva) return; emReserva = true;
  map.removeLayer(dgt);
  if (!fundoMapa) map.setMaxZoom(18);

}
if (navigator.onLine === false) setTimeout(() => reserva('offline'), 0); // adiado: o resto da página ainda está a ser montado
else {
  dgt.on('tileload', () => { dgtOk = true; });

const mapaCidade = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { pane: 'sat', maxZoom: 20, maxNativeZoom: 19, attribution: 'Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores do OpenStreetMap</a>' });

  fundoMapa = ligar === undefined ? !fundoMapa : ligar;

const MUNDO = [[-89, -180], [-89, 180], [89, 180], [89, -180]];

L.polyline(LIMITES.map(a => a.concat([a[0]])), { pane: 'limite', color: '#ffffff', weight: 10, opacity: .35, className: 'limite-halo', interactive: false }).addTo(map);
L.polyline(LIMITES.map(a => a.concat([a[0]])), { pane: 'limite', color: '#ffffff', weight: 2, opacity: .95, className: 'limite', interactive: false }).addTo(map);

// ---------- marcadores e geometrias dos pontos de interesse ----------
const vista = {}; // id -> { el, camadas, marcadores, linha, halo, poligono }
function icone(el, filho) {
  const p = priDe(el), s = filho ? 13 : 18;

}

const estiloRua = el => { const p = priDe(el); return { linha: { color: p.cor, weight: 4, opacity: .9 }, halo: { color: p.id === 'urgente' ? '#ffffff' : p.cor, weight: 16, opacity: p.id === 'urgente' ? .28 : .2 } }; };

function construirElemento(el) {
  const v = { el, camadas: [], marcadores: [] };
  vista[el.id] = v;
  if (el.tipo === 'ponto') {

    const halo = L.polyline(el.linhas, { pane: 'ruas', ...e.halo, lineCap: 'round', bubblingMouseEvents: false }).addTo(map);
    const linha = L.polyline(el.linhas, { pane: 'ruas', ...e.linha, className: cls, lineCap: 'round', bubblingMouseEvents: false }).addTo(map);
    halo.bindTooltip(el.nome, { sticky: true, className: 'rotulo', opacity: 1 }); linha.bindTooltip(el.nome, { sticky: true, className: 'rotulo', opacity: 1 });

    pol.bindTooltip(el.nome, { sticky: true, className: 'rotulo', opacity: 1 });

// ondas ao passar o cursor numa rua ou zona destacada, como os anéis dos pontos: dois traçados invisíveis

function criarEcos(Tipo, geometria, pane, el, classe) {

  return [0, 1].map(i => Tipo(geometria, { pane, color: cor, weight: 4, opacity: 0, fill: false, interactive: false, lineCap: 'round', lineJoin: 'round', className: `eco ${classe} eco-${i}` }).addTo(map));
}
function ligarPulsar(v, partes) {

  for (const parte of partes) {

    parte.on('mouseout', () => { dentro = Math.max(0, dentro - 1); clearTimeout(temporizador); temporizador = setTimeout(aplicar, 60); }); // passar da linha para o halo não reinicia a onda

// margens do voo. Pontos e ruas: o cartão fica ao centro, por isso o alvo sobe um pouco.
// Zonas (e pontos dentro delas): o cartão encosta à direita e a zona cresce até ocupar grande parte do espaço livre.
// Em ecrãs estreitos o cartão ocupa a parte de baixo.
function margensVoo(el, encostar) {
  const W = window.innerWidth, H = window.innerHeight, zona = !!(el && (el.tipo === 'zona' || el.pai)) || !!encostar || ecraBaixo();
  if (estreito()) return { modo: 'baixo', paddingTopLeft: [20, 70], paddingBottomRight: [20, Math.round(H * .5) + 108] }; // o cartão em baixo tem até 50vh, mais 92 px de margem
  if (!zona) return { modo: 'centro', paddingTopLeft: [80, 80], paddingBottomRight: [80, 120] };
  // zona: o cartão encosta à direita (400 px) ou em baixo (até 38 % da altura), conforme o que deixa a zona maior
  const lado = { modo: 'lado', paddingTopLeft: [Math.round(W * .03), 66], paddingBottomRight: [Math.round(W * .02) + 414, 36], maxZoom: 20 };
  const baixo = { modo: 'baixo', paddingTopLeft: [24, 66], paddingBottomRight: [24, Math.round(H * .38) + 92], maxZoom: 20 };

  if (!el || !limitesDe(el)) return lado; // cartão sem elemento (categoria) ou sem lugar no mapa
  const zoomCom = o => map.getBoundsZoom(limitesDe(el), false, L.point(o.paddingTopLeft).add(L.point(o.paddingBottomRight)));
  return zoomCom(lado) >= zoomCom(baixo) ? lado : baixo;
}
// ao desselecionar uma zona (ou um ponto dentro dela) o mapa volta à vista inicial da freguesia

}

function selecionar(el, voar, semCartao) {
  limparSelecao(); limparRuaDestaque(); categoriaAtual = null;

}

  if (cats.length) h += `<div class="cats">${cats.map(c => `<button class="chip mini" data-so-cat="${c.id}" style="--c:${c.cor}" title="Ver a categoria">${c.icone ? esc(c.icone) + ' ' : ''}${esc(c.nome)}</button>`).join('')}</div>`;

const FREGUESIAS = (window.FREGUESIAS || []).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));

const qsTexto = qs => { const t = qs.toString().replace(/=(&|$)/g, '$1'); return t ? '?' + t : ''; }; // «?cidade» em vez de «?cidade=»
// muda de freguesia: recarrega a página só com os dados dela (com alterações por guardar, pergunta se as guarda ou descarta)
async function irParaFreguesia(id) {
  if (id === FREG.id) { if (cidade) abrirCidade(false); else map.flyToBounds(limiteBounds, Object.assign({ duration: .9 }, margensGerais())); return; }
  if (!FREGUESIAS.some(f => f.id === id)) return;
  if (edicao && alterado) {
    const r = await perguntarGuardar('Mudar de freguesia', 'mudar');
    if (r === 'cancelar') return false;
    if (r === 'guardar') { if ((await guardar()) === 'transferido') await new Promise(ok => setTimeout(ok, 1200)); } // dá tempo à transferência antes de mudar de página
    else descartarAlteracoes();
  }
  alterado = false; // nada por guardar: não pedir confirmação ao sair da página
  const b = listaFreg.querySelector(`[data-freg="${id}"]`); if (b) { b.classList.add('a-carregar'); b.textContent += '…'; }
  try { localStorage.setItem('co-freguesia', id); } catch (err) { /* sem armazenamento local */ }
  const qs = new URLSearchParams(location.search); qs.set('freguesia', id); qs.delete('cidade');
  location.href = location.pathname + qsTexto(qs);
  return true; // a página vai mudar
}

function construirIndice() {

const INDICE_PESQUISA = [];
function construirPesquisa() {
  INDICE_PESQUISA.length = 0;
  // cada entrada tem o nome completo e, nas vias, um alias sem o tipo («Saraiva de Carvalho» para «Rua Saraiva de Carvalho»)
  const PREFIXO = /^(rua|avenida|av\.|travessa|largo|praca|jardim|beco|calcada|estrada|alameda|escadinhas|patio|azinhaga|campo|rotunda|parque|mercado|igreja) (d[aeo]s? )?/;
  const add = (nome, tipo, acao, cor) => {
    const chave = normalizar(nome), m = chave.match(PREFIXO);
    const nomes = [nome], chaves = [chave];
    if (m && m[0].length < nome.length) { nomes.push(nome.slice(m[0].length)); chaves.push(chave.slice(m[0].length)); }
    INDICE_PESQUISA.push({ nome, chave, nomes, chaves, tipo, acao, cor });
  };
  const todos = todosElementos();
  for (const el of todos) add(el.nome, el.pai ? 'ponto' : el.tipo, () => selecionar(el, true), corDe(el));
  const nomesPOI = new Set(todos.filter(e => e.tipo === 'rua').map(e => normalizar(e.nome)));
  for (const r of RUAS_VISTA) if (!nomesPOI.has(normalizar(r.rua.nome))) add(r.rua.nome, 'rua-osm', () => destacarRua(r, true));
  for (const c of C.categorias || []) add(c.nome, 'categoria', () => { alternarCategoria(c.id, true); mostrarCategoria(c); const b = limitesCategoria(c); if (b) map.flyToBounds(b, Object.assign({ duration: .9 }, margensGerais())); }, c.cor);
  for (const f of FREGUESIAS) add(f.nome, 'freguesia', () => irParaFreguesia(f.id), f.id === FREG.id ? '#f3c35b' : '#ffffff');
  INDICE_PESQUISA.sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
}
const ETQ = { ponto: 'ponto', grupo: 'conjunto', desmaterializado: 'sem lugar', rua: 'rua', zona: 'zona', 'rua-osm': 'rua', categoria: 'categoria', freguesia: 'freguesia' };

let resultados = [], ativo = -1;
function procurar(q) {
  const n = normalizar(q.trim()); if (!n) return [];
  const comeca = [], contem = [], palavra = [], partes = n.split(/\s+/).filter(Boolean);
  for (const it of INDICE_PESQUISA) {
    const ws = it.chave.split(/[\s\-–,()]+/);
    if (it.chaves.some(c => c.startsWith(n))) comeca.push(it);
    else if (ws.some(w => w.startsWith(n))) palavra.push(it);
    else if (partes.length > 1 && partes.every(p => ws.some(w => w.startsWith(p)))) palavra.push(it); // «quinta lou» encontra «Bairro da Quinta do Loureiro»
    else if (it.chave.includes(n)) contem.push(it);

function transferir(dados) {

// ---- criar, apagar, ordenar, mover ----
function idDe(nome) { return normalizar(nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50).replace(/-$/, '') || 'elemento'; } // até 50 caracteres (o servidor aceita até 61)
function acrescentar(el, pai) {
  let id = idDe(el.nome); for (let k = 2; POR_ID[id]; k++) id = idDe(el.nome) + '-' + k;
  el.id = id; el.fotos = el.fotos || []; el.texto = el.texto || '';
  const p = preparar(el, pai); if (!p) { aviso('Não foi possível criar o elemento.', 3000); return; }
  if (pai) pai.filhos.push(p); else ELEMENTOS.push(p);
  construir(); construirIndice(); construirPesquisa(); marcarAlterado();
  selecionar(p, false);
  setTimeout(() => { const i = modalConteudo.querySelector('input[name=nome]'); if (i) { i.focus(); i.select(); } }, 60);
  return p;
}
function novoPonto(ll) { criados++; const z = zonaEm(ll, null); acrescentar({ tipo: 'ponto', nome: 'Novo ponto ' + criados, icone: '📍', pos: arredLL(ll) }, z && !z.oculto ? z : null); }
function terminarZona(pts) {
  cancelarDesenho();

  criados++;
  acrescentar({ tipo: 'zona', nome: 'Nova zona ' + criados, icone: '⬠', poligono: pts.map(arredLL) }, null);
  porFerramenta('mover');
}
function criarRua(r) {
  const ja = ELEMENTOS.find(e => e.tipo === 'rua' && normalizar(e.nome) === normalizar(r.rua.nome));
  if (ja) { aviso('Essa rua já é um elemento.', 2500); selecionar(ja, false); porFerramenta('mover'); return; }
  acrescentar({ tipo: 'rua', nome: r.rua.nome, icone: '🛣️', rua: r.rua.nome }, null);
  porFerramenta('mover');
}
function criarDeLote(l) {
  criados++;
  acrescentar({ tipo: 'zona', nome: l.m || 'Lote ' + criados, icone: '🏠', poligono: l.p.map(p => p.slice()), lote: l.c || '' }, null);
  porFerramenta('mover');

// conjunto de pontos: um só cartão para vários pontos no mapa
function pontoDeGrupo(ll) {
  if (grupoEmCurso && POR_ID[grupoEmCurso.id] === grupoEmCurso) {
    grupoEmCurso.pontos.push(arredLL(ll)); construir(); marcarAlterado(); selecionar(grupoEmCurso, false);
    aviso(`«${grupoEmCurso.nome}»: ${grupoEmCurso.pontos.length} pontos.`, 1800); return;
  }
  criados++;
  const g = acrescentar({ tipo: 'grupo', nome: 'Novo conjunto ' + criados, icone: '⁘', pontos: [arredLL(ll)] }, null);
  if (g) { grupoEmCurso = g; $('#dica').textContent = `Clica no mapa para acrescentar pontos a «${g.nome}» · Esc termina`; }
}
function emConjunto(el) { // um ponto passa a conjunto (com esse ponto como primeiro)
  if (el.pai) { aviso('Um ponto dentro de uma zona não pode ser conjunto.', 3000); return; }
  el.tipo = 'grupo'; el.pontos = [el.pos]; delete el.pos;
  construir(); construirIndice(); construirPesquisa(); marcarAlterado();
  porFerramenta('grupo', el); selecionar(el, false);
}
// pontos desmaterializados: sem lugar no mapa (aparecem no canto superior direito)
function novoDesmaterializado() {
  criados++; porFerramenta('mover');
  acrescentar({ tipo: 'desmaterializado', nome: 'Novo ponto desmaterializado ' + criados, icone: '💬' }, null);
  aviso('Os pontos desmaterializados não têm lugar no mapa: aparecem no canto superior direito.', 4500);
}
function desmaterializar(el) {
  if (el.pai) { el.pai.filhos.splice(el.pai.filhos.indexOf(el), 1); el.pai = null; ELEMENTOS.push(el); }
  el.tipo = 'desmaterializado'; delete el.pos; delete el.area; delete el.pontos;
  construir(); construirIndice(); construirPesquisa(); marcarAlterado(); selecionar(el, false);
  aviso(`«${el.nome}» saiu do mapa: está nos pontos desmaterializados, no canto superior direito.`, 4000);

function colocarNoMapa(el, ll) { // um ponto desmaterializado ganha lugar (dentro de uma zona, se for o caso)
  porFerramenta('mover');
  if (!el || POR_ID[el.id] !== el) return;
  el.tipo = 'ponto'; el.pos = arredLL(ll);
  const z = zonaEm(ll, null);
  if (z && !z.oculto) { ELEMENTOS.splice(ELEMENTOS.indexOf(el), 1); el.pai = z; z.filhos.push(el); }

// criar na localização atual (telemóvel): um ponto, ou a rua mais próxima
function localizar() {
  return new Promise((ok, falha) => {
    if (!window.isSecureContext) { falha(new Error('o browser só dá a localização a páginas em https ou abertas no próprio aparelho (localhost)')); return; }
    if (!navigator.geolocation) { falha(new Error('este browser não dá a localização')); return; }
    aviso('A obter a localização…');
    navigator.geolocation.getCurrentPosition(p => ok(L.latLng(p.coords.latitude, p.coords.longitude)),
      e => falha(new Error(e.code === 1 ? 'a autorização foi recusada' : e.code === 3 ? 'demorou demasiado' : 'localização indisponível')),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}
function ruaMaisProxima(ll) { // em metros (aproximados) até ao troço mais próximo de cada rua
  const proj = x => map.options.crs.project(L.latLng(x)), P = proj(ll), k = Math.cos(L.latLng(ll).lat * Math.PI / 180);
  let melhor = null, md = Infinity;
  for (const r of RUAS_VISTA) for (const t of r.rua.trocos) for (let i = 1; i < t.length; i++) {
    const d = L.LineUtil.pointToSegmentDistance(P, proj(t[i - 1]), proj(t[i])) * k;
    if (d < md) { md = d; melhor = r; }
  }
  return melhor ? { r: melhor, d: md } : null;
}
async function criarAqui(tipo) {
  let ll; try { ll = await localizar(); } catch (err) { aviso('Sem localização: ' + err.message + '.', 5000); return; }
  $('#aviso').classList.remove('aberto');
  if (!LIMITES.some(a => dentro(ll, a)) && !(await confirmar('Fora da freguesia', `A tua localização fica fora de ${esc(FREG.nome)}. Criar mesmo assim nesse sítio?`, 'Criar'))) return;
  map.flyTo(ll, Math.max(map.getZoom(), 18), { duration: .8 });
  if (tipo === 'ponto') { porFerramenta('mover'); novoPonto(ll); return; }
  const r = ruaMaisProxima(ll);
  if (!r || r.d > 60) { aviso('Não há nenhuma rua a menos de 60 m da tua localização.', 4500); return; }
  criarRua(r.r);
}
function removerDoModelo(el) {
  const lista = el.pai ? el.pai.filhos : ELEMENTOS; const i = lista.indexOf(el); if (i >= 0) lista.splice(i, 1);
  delete POR_ID[el.id]; for (const f of el.filhos || []) delete POR_ID[f.id];
}
async function apagar(el) {
  const n = (el.filhos || []).length;
  if (!(await confirmar('Apagar elemento', `Apagar «${esc(el.nome)}»${n ? ` e os seus ${n} ponto${n > 1 ? 's' : ''}` : ''}?`, 'Apagar', true))) return;
  limparSelecao(); fecharCartao(); removerDoModelo(el);
  const ids = [el.id, ...(el.filhos || []).map(f => f.id)]; // sai também das categorias e da visita
  for (const c of C.categorias) c.membros = c.membros.filter(id => !ids.includes(id));
  if (Array.isArray(C.visita)) C.visita = C.visita.filter(id => !ids.includes(id));

}
function reordenar(el, delta) {
  const lista = el.pai ? el.pai.filhos : ELEMENTOS; const i = lista.indexOf(el), j = i + delta;
  if (i < 0 || j < 0 || j >= lista.length) return;

// o ponto foi largado depois de arrastado: nova posição e, se for o caso, nova zona-mãe
function largarPonto(el, idx, ll, zona) {
  const pos = arredLL(ll);
  if (el.tipo === 'grupo') el.pontos[idx] = pos;
  else {
    el.pos = pos; delete el.area;
    if (zona !== el.pai) {
      const lista = el.pai ? el.pai.filhos : ELEMENTOS; lista.splice(lista.indexOf(el), 1);
      el.pai = zona; (zona ? zona.filhos : ELEMENTOS).push(el);
      aviso(zona ? `«${el.nome}» passou para dentro de «${zona.nome}».` : `«${el.nome}» saiu da zona.`, 3000);
    }
  }
  construir(); construirIndice(); construirPesquisa(); marcarAlterado();

}
function marcarAlvo(z) {
  if (alvoZona && alvoZona !== z) { const p = vista[alvoZona.id] && vista[alvoZona.id].poligono; if (p && p._path) p._path.classList.remove('alvo'); }
  alvoZona = z;
  if (z) { const p = vista[z.id] && vista[z.id].poligono; if (p && p._path) p._path.classList.add('alvo'); }
}
function ligarArrasto(m, el, idx) { // chamado por marcador() quando a edição está ligada
  m.on('dragstart', () => { m.closeTooltip(); });
  m.on('drag', () => {
    const e = m.getElement(); if (!e) return;
    if (el.tipo !== 'ponto') return;
    const z = zonaEm(m.getLatLng(), null);
    marcarAlvo(z && z !== el.pai ? z : null);
    e.classList.toggle('mergulhar', !!(z && z !== el.pai));
    e.classList.toggle('emergir', !z && !!el.pai);
  });
  m.on('dragend', () => {
    const ll = m.getLatLng(), z = el.tipo === 'ponto' ? zonaEm(ll, null) : null;
    marcarAlvo(null);
    largarPonto(el, idx, ll, z);
  });
}

// ---- vértices da zona selecionada ----
const verticesGrupo = L.layerGroup().addTo(map);
function mostrarVertices(el) {
  verticesGrupo.clearLayers();
  if (!edicao || !el || el.tipo !== 'zona') return;
  const pts = el.poligono, pol = vista[el.id].poligono;
  const alterarGeometria = () => { delete el.area; pol.setLatLngs(pts); for (const e of vista[el.id].ecos || []) e.setLatLngs(pts); }; // as ondas seguem o contorno
  pts.forEach((p, i) => {
    const h = L.marker(p, { icon: L.divIcon({ className: 'vertice', iconSize: [12, 12], iconAnchor: [6, 6] }), draggable: true, bubblingMouseEvents: false, keyboard: false });
    h.on('drag', () => { pts[i] = arredLL(h.getLatLng()); alterarGeometria(); });
    h.on('dragend', () => { marcarAlterado(); mostrarVertices(el); });
    h.on('dblclick', e => { L.DomEvent.stop(e); if (pts.length <= 3) return; pts.splice(i, 1); alterarGeometria(); marcarAlterado(); mostrarVertices(el); });
    verticesGrupo.addLayer(h);
    const q = pts[(i + 1) % pts.length], meio = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const hm = L.marker(meio, { icon: L.divIcon({ className: 'vertice medio', iconSize: [10, 10], iconAnchor: [5, 5] }), draggable: true, bubblingMouseEvents: false, keyboard: false });
    hm.on('dragstart', () => { pts.splice(i + 1, 0, meio.slice()); hm._idx = i + 1; });
    hm.on('drag', () => { pts[hm._idx] = arredLL(hm.getLatLng()); alterarGeometria(); });
    hm.on('dragend', () => { marcarAlterado(); mostrarVertices(el); });
    verticesGrupo.addLayer(hm);
  });
}

function redimensionar(file, max) { // devolve data URL da imagem reduzida (só quando não há servidor para a guardar)

    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagem ilegível')); };
    img.src = url;
  });
}
