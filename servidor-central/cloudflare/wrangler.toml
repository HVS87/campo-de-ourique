# Apresentação e servidor central no Cloudflare Workers (plano grátis). Passos para publicar: servidor-central/GUIA-CLOUDFLARE.md.
name = "ps-lisboa-repositorio"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# dados no R2, na União Europeia (o balde cria-se com: npx wrangler r2 bucket create ps-lisboa-repositorio --jurisdiction eu)
[[r2_buckets]]
binding = "DADOS"
bucket_name = "ps-lisboa-repositorio"
jurisdiction = "eu"

# o site: ficheiros estáticos gerados por «node tools/preparar-site.mjs» (a pasta site/ não vai para o git)
[assets]
directory = "../../site"
binding = "ASSETS"
# a API, a página de consulta e os dados guardados passam pelo Worker; o resto é servido diretamente
run_worker_first = ["/api/*", "/consulta", "/consulta.html", "/dados/conteudos.js", "/dados/presets/*", "/dados/freguesias/*/conteudos.js", "/dados/freguesias/*/presets/*"]

[vars]
NOME = "Servidor central das freguesias de Lisboa"
# endereços da apresentação que podem usar a API a partir do browser (separados por vírgulas; * = todos)
ORIGENS = "*"
# "1" deixa consultar sem chave
LEITURA_PUBLICA = "0"
# a chave de administração não fica aqui: npx wrangler secret put CHAVE_ADMIN (e, opcional, SEGREDO_SESSOES)

# a página de consulta entra no Worker como texto
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
